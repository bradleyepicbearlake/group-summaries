<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Group Summaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0EE; --border:#D7E1DD;
    --ink:#16231F; --ink-soft:#4A5C55; --muted:#7C8F88;
    --accent:#0E7C86; --accent-ink:#063C41; --accent-soft:#E1F2F1;
    --warm:#C97C3D; --warm-soft:#FBEEE0;
    --good:#3E7A4E; --good-soft:#E7F3EA;
    --danger:#B0473F; --danger-soft:#FAEAE8;
    --shadow:0 1px 2px rgba(15,35,30,.07), 0 10px 28px -14px rgba(15,35,30,.22);
    --radius:10px; --radius-sm:6px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1613; --surface:#16211D; --surface-2:#1C2925; --border:#2A3B35;
      --ink:#E7EFEC; --ink-soft:#B7C7C1; --muted:#7E958D;
      --accent:#4FC2C9; --accent-ink:#DFFAF9; --accent-soft:#163538;
      --warm:#E0996A; --warm-soft:#3A2A1B;
      --good:#7CC28D; --good-soft:#1B3423;
      --danger:#E28880; --danger-soft:#3A201D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1613; --surface:#16211D; --surface-2:#1C2925; --border:#2A3B35;
    --ink:#E7EFEC; --ink-soft:#B7C7C1; --muted:#7E958D;
    --accent:#4FC2C9; --accent-ink:#DFFAF9; --accent-soft:#163538;
    --warm:#E0996A; --warm-soft:#3A2A1B;
    --good:#7CC28D; --good-soft:#1B3423;
    --danger:#E28880; --danger-soft:#3A201D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface);}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.15;}
  .brand-sub{font-size:12px; color:var(--muted); letter-spacing:.02em;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .sync-pill{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
    padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border);
  }
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--good);}
  .sync-pill.local .sync-dot{background:var(--warm);}
  .tabs{display:flex; gap:8px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:600; transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.ghost:hover{background:var(--surface-2); border-color:var(--border);}
  .btn.danger-hover:hover{border-color:var(--danger); color:var(--danger);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .btn:hover[disabled]{border-color:var(--border); background:var(--surface); color:var(--ink);}
  .btn svg{width:15px; height:15px; flex:none;}

  main{max-width:1120px; margin:0 auto; padding:28px 24px 80px;}

  /* ---------- List view ---------- */
  .list-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
  .list-head h1{font-size:26px;}
  .list-head p{margin:4px 0 0; color:var(--muted); font-size:13.5px;}
  .list-controls{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .search-input{
    flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink);
  }
  .filter-select{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);}
  .year-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .year-tab{
    padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-size:13px; font-weight:600; transition:border-color .15s, background .15s, color .15s;
  }
  .year-tab:hover{border-color:var(--accent); color:var(--ink);}
  .year-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .group-list{display:flex; flex-direction:column; gap:10px;}
  .group-card{
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .group-card:hover{border-color:var(--accent);}
  .group-card:active{transform:scale(.997);}
  .gc-main{min-width:0;}
  .gc-name{font-weight:700; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gc-org{color:var(--muted); font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gc-dates{font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .gc-guests{font-size:13px; color:var(--ink-soft); white-space:nowrap; text-align:right;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px; white-space:nowrap;
  }
  .pill.draft{background:var(--warm-soft); color:var(--warm);}
  .pill.confirmed{background:var(--good-soft); color:var(--good);}
  .pill.example{background:var(--surface-2); color:var(--muted);}
  .pill.monthyear{background:var(--accent-soft); color:var(--accent-ink);}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted); border:1px dashed var(--border); border-radius:var(--radius);
  }

  /* ---------- Section cards (edit + detail) ---------- */
  .section-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px;
  }
  .section-title{
    display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700;
    color:var(--accent-ink); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .section-index{
    width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;
    font-family:'IBM Plex Mono',monospace;
  }
  .field-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field span{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field.wide{grid-column:1 / -1;}
  .check-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:4px;}
  .check-row label{display:flex; align-items:center; gap:6px; font-size:13.5px;}

  .row-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .row-table th{
    text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); padding:0 8px 6px; border-bottom:1px solid var(--border);
  }
  .row-table td{padding:4px 6px; vertical-align:top;}
  .row-table td input, .row-table td select{width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px;}
  .row-table td textarea.autogrow{
    display:block; width:100%; min-height:32px; padding:6px 8px; border:1px solid var(--border); border-radius:6px;
    font:inherit; line-height:1.45; resize:none; overflow:hidden; box-sizing:border-box;
  }
  .row-del{background:transparent; border:none; color:var(--muted); font-size:15px; padding:6px; border-radius:6px;}
  .row-del:hover{color:var(--danger); background:var(--danger-soft);}
  .add-row-btn{
    margin-top:8px; font-size:12.5px; font-weight:600; color:var(--accent); background:var(--accent-soft);
    border:none; padding:7px 12px; border-radius:var(--radius-sm);
  }
  .add-row-btn:hover{background:var(--accent); color:#fff;}
  .table-wrap{overflow-x:auto;}

  .edit-actions{
    position:sticky; bottom:0; display:flex; justify-content:flex-end; gap:10px;
    padding:14px 0 4px; background:linear-gradient(to top, var(--bg) 60%, transparent);
  }

  /* ---------- Detail view ---------- */
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:18px; flex-wrap:wrap;
  }
  .detail-title h1{font-size:25px; margin-bottom:5px;}
  .detail-title .gc-org{font-size:14px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .kv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px 22px;}
  .kv{display:flex; flex-direction:column; gap:2px;}
  .kv-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .kv-value{font-size:14.5px; font-weight:600;}
  .kv-value.mono{font-weight:500;}
  .detail-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .detail-table th{
    text-align:left; padding:7px 10px; background:var(--surface-2); color:var(--ink-soft);
    font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--border);
  }
  .detail-table td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; white-space:pre-wrap; overflow-wrap:anywhere;}
  .detail-table tr:last-child td{border-bottom:none;}
  .prose{white-space:pre-wrap; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{background:var(--accent-soft); color:var(--accent-ink); font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .muted-note{color:var(--muted); font-size:13px; font-style:italic;}
  textarea[data-bind="itineraryNotes"]{min-height:180px;}
  .attachment-card{width:160px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2);}
  .attachment-card img{width:100%; max-height:120px; object-fit:cover; display:block;}
  .attachment-card .ac-body{padding:8px 10px;}
  .attachment-card .ac-name{font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attachment-row{display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--surface-2); border-radius:6px; font-size:13px; margin-bottom:6px;}
  .attachment-row span.name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .subcard{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:12px; background:var(--surface-2); }
  .subcard-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .subcard-title{ font-size:11.5px; font-weight:700; color:var(--accent-ink); text-transform:uppercase; letter-spacing:.04em; }
  .subcard .field-grid{ margin-bottom:10px; }
  .subcard .field span{ font-size:11px; }
  .task-count{
    min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace;
  }

  @media print{
    .topbar, .detail-actions{display:none !important;}
    main{max-width:none; padding:0;}
    .section-card{box-shadow:none; break-inside:avoid;}
  }
  @media (max-width:640px){
    .group-card{grid-template-columns:1fr; align-items:flex-start; gap:8px;}
    .gc-guests{text-align:left;}
  }
</style>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="var(--accent-soft)"/>
      <path d="M6 26L14 15L19 21L24 13L34 26" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      <path d="M4 30C7 28 9.5 28 12.5 30C15.5 32 18 32 21 30C24 28 26.5 28 29.5 30C32.5 32 34 32 36 30" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </svg>
    <div>
      <div class="brand-name">Epic Bear Lake Retreats</div>
      <div class="brand-sub">Group Summaries</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncLabel">Connecting&hellip;</span></span>
    <div class="tabs">
      <button class="btn ghost" id="navList">All Groups</button>
      <button class="btn ghost" id="navTasks">Tasks</button>
      <button class="btn primary" id="navNew">+ New Summary</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
(function(){
  "use strict";

  /* ---------------- utilities ---------------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function uid(){ return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function getPath(obj, path){
    return path.split('.').reduce((o,k)=> (o==null? undefined : o[k]), obj);
  }
  function setPath(obj, path, value){
    const keys = path.split('.');
    let cur = obj;
    for(let i=0;i<keys.length-1;i++){
      const k = keys[i], nextK = keys[i+1];
      if(cur[k] == null) cur[k] = /^\d+$/.test(nextK) ? [] : {};
      cur = cur[k];
    }
    cur[keys[keys.length-1]] = value;
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
  function fmtDateShort(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }
  function nightsBetween(a,b){
    if(!a||!b) return null;
    const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
    if(isNaN(d1)||isNaN(d2)) return null;
    return Math.round((d2-d1)/86400000);
  }
  function monthYearKey(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return '';
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
  }
  function monthYearLabel(key){
    if(!key) return '';
    const parts = key.split('-');
    const dt = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    if(isNaN(dt.getTime())) return key;
    return dt.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  }

  const PROPERTIES = ["Sunrise Resort","Beaver Creek Lodge","Eagle's Roost","Oso Blue Yurts","Beach House","Condos"];
  const EVENT_SPACES = ["Sunrise Hall","Moose Hollow","Azure Cove","Cisco Board Room","Beaver Creek Lodge Gathering Room"];
  const SESSION_TYPES = ["Partial Day","Full Day"];
  const TABLE_TYPES = ["Lifetime 8 Ft","Banquet 8 Ft","Rounds"];
  const CHAIR_TYPES = ["Blue","White"];
  const AV_OPTIONS = ["Podium","TV","Projector","Sonos","Microphones","Round the Clock Assistance"];
  const STAFF_OPTIONS = ["Bradley","Kristen","Sam","Kylie","Tricia","Mark","Jack","Carter","Morgan"];
  const ORIENTATIONS = ["Banquet","U-Shape","Conference","Stadium","Custom"];
  const MAX_ATTACHMENT_BYTES = 10*1024*1024;

  function buildTimeSlots(){
    const slots = [];
    for(let h=0; h<24; h++){
      for(let m=0; m<60; m+=15){
        const value = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        const period = h < 12 ? 'AM' : 'PM';
        let h12 = h % 12; if(h12 === 0) h12 = 12;
        slots.push({ value:value, label: h12 + ':' + String(m).padStart(2,'0') + ' ' + period });
      }
    }
    return slots;
  }
  const TIME_SLOTS = buildTimeSlots();
  function timeLabelFor(value){
    const slot = TIME_SLOTS.find(function(s){ return s.value === value; });
    return slot ? slot.label : (value || '');
  }
  function timeRangeLabel(start, end){
    const a = timeLabelFor(start), b = timeLabelFor(end);
    if(a && b) return a + ' – ' + b;
    if(b) return 'Until ' + b;
    return a;
  }
  function timeSelectHtml(path, selected){
    const opts = TIME_SLOTS.map(function(s){ return '<option value="'+s.value+'"'+(selected===s.value?' selected':'')+'>'+s.label+'</option>'; }).join('');
    return '<select data-bind="'+path+'"><option value=""></option>'+opts+'</select>';
  }
  function plainSelectHtml(path, options, selected){
    const opts = options.map(function(o){ return '<option value="'+esc(o)+'"'+(selected===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
    return '<select data-bind="'+path+'"><option value=""></option>'+opts+'</select>';
  }
  function checkGroup(label, path, options, selected){
    selected = selected || [];
    return '<div class="field" style="margin-top:10px;"><span>'+esc(label)+'</span><div class="check-row">' +
      options.map(function(o){
        return '<label><input type="checkbox" data-toggle-array="'+path+'" data-value="'+esc(o)+'" '+(selected.indexOf(o)>-1?'checked':'')+'> '+esc(o)+'</label>';
      }).join('') +
    '</div></div>';
  }
  function chipList(arr){
    return (arr && arr.length) ? '<div class="tag-list">'+arr.map(function(a){ return '<span class="tag">'+esc(a)+'</span>'; }).join('')+'</div>' : '<span class="muted-note">—</span>';
  }

  function newEventSpaceSession(){
    return { day:'', dayEnd:'', time:'', timeEnd:'', session:'', orientation:'', orientationNotes:'', spaces:[], tableTypes:[], numTables:'', chairTypes:[], numChairs:'', avNeeds:[], staff:[], notes:'' };
  }

  function formatDateRange(start, end){
    if(!start) return '';
    if(!end || end === start) return fmtDateShort(start);
    return fmtDateShort(start) + ' – ' + fmtDateShort(end);
  }

  function formatBytes(n){
    if(!n) return '0 KB';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }

  function readFileAsDataURL(file){
    return new Promise(function(resolve,reject){
      const r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error || new Error('Could not read file')); };
      r.readAsDataURL(file);
    });
  }

  function collectEmployeeNames(){
    const set = new Set();
    state.groups.forEach(function(g){
      ((g.staffing && g.staffing.internal) || []).forEach(function(s){ if(s.name) set.add(String(s.name).trim()); });
      (g.tasks || []).forEach(function(t){ if(t.assignee) set.add(String(t.assignee).trim()); });
    });
    return Array.from(set).filter(Boolean).sort();
  }

  function emptyGroup(){
    const now = new Date().toISOString();
    return {
      status:'draft',
      groupName:'', orgName:'', contactName:'', contactPhone:'', contactEmail:'',
      arrivalDate:'', departureDate:'', totalGuests:'', coordinator:'',
      transportation:{ mode:'', arrivalDetails:'', departureDetails:'', shuttleNeeded:false, notes:'' },

  /* ---------------- state ---------------- */
  // Paste the Web app URL from your Google Apps Script deployment here (see the setup guide).
  // Until this is filled in, the tool works fine for one person but nothing syncs between browsers.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwF1r0ntuEhPccMCygw_lPz7fVZBQsHfAG6bClle2G6o44rGqcWGJssT1aAhYf3bu2zVw/exec';

  const state = { view:'list', currentId:null, groups:[], mode:'connecting', search:'', filter:'all', monthFilter:'all', yearFilter:'all' };
  let draft = null;
  let pollTimer = null;
  const tableConfigs = {};
  const LOCAL_KEY = 'eblr-group-summaries-v1';
  const POLL_MS = 15000;

  function apiConfigured(){
    return !!API_URL && API_URL.indexOf('PASTE_YOUR_') !== 0;
  }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ state.groups = JSON.parse(raw); return; }
    }catch(e){}
    const ex = exampleGroup(); ex.id = 'example-demo';
    state.groups = [ex];
    saveLocal();
  }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state.groups)); }catch(e){}
  }

  function setSyncPill(){
    const pill = document.getElementById('syncPill');
    const label = document.getElementById('syncLabel');
    if(state.mode === 'remote'){
      pill.classList.remove('local');
      label.textContent = 'Synced for your team';
    } else if(state.mode === 'local'){
      pill.classList.add('local');
      label.textContent = apiConfigured() ? 'Offline — saved in this browser only' : 'Saved in this browser only';
    } else {
      label.textContent = 'Connecting…';
    }
  }

  // ---- Talking to the Google Apps Script ----
  // Every request gets a time limit, a readable error if Google sends back a web page
  // instead of data, and one automatic retry for brief hiccups.
  const REQUEST_TIMEOUT_MS = 25000;
  let writeSeq = 0;          // bumps every time this browser saves or deletes
  let writesInFlight = 0;    // saves/deletes currently on their way to the sheet
  let pollInFlight = false;  // stops polls from piling on top of each other
  let pollFailures = 0;      // consecutive failed polls

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function apiRequest(method, payload){
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;
    try{
      const opts = { cache:'no-store', redirect:'follow' };
      if(ctrl) opts.signal = ctrl.signal;
      let url = API_URL;
      if(method === 'GET'){
        url += (url.indexOf('?') > -1 ? '&' : '?') + 'action=' + encodeURIComponent(payload.action) + '&_=' + Date.now();
      } else {
        opts.method = 'POST';
        // Sent as plain text on purpose: a JSON content-type makes the browser ask
        // Google for permission first, which Apps Script can't answer.
        opts.headers = { 'Content-Type':'text/plain;charset=utf-8' };
        opts.body = JSON.stringify(payload);
      }
      const resp = await fetch(url, opts);
      const text = await resp.text();
      let data;
      try{ data = JSON.parse(text); }
      catch(e){
        const err = new Error('Google returned a web page instead of data. The Apps Script may need to be redeployed (Deploy → Manage deployments → New version) with access set to "Anyone".');
        err.permanent = true;
        throw err;
      }
      if(!data.ok){
        const err = new Error(data.error || 'The shared sheet reported an error.');
        err.permanent = true;
        throw err;
      }
      return data;
    }catch(e){
      if(e && e.name === 'AbortError') throw new Error('The shared sheet took too long to respond.');
      if(e && e.message === 'Failed to fetch') throw new Error('Could not reach the shared sheet (network problem).');
      throw e;
    }finally{
      if(timer) clearTimeout(timer);
    }
  }

  async function apiWithRetry(method, payload){
    try{
      return await apiRequest(method, payload);
    }catch(e){
      if(e && e.permanent) throw e;
      await sleep(1500);
      return await apiRequest(method, payload);
    }
  }

  async function refreshFromServer(silent){
    if(!apiConfigured()){
      state.mode = 'local';
      setSyncPill();
      return;
    }
    // Don't poll while a save is on its way, and don't stack polls.
    if(pollInFlight || writesInFlight > 0) return;
    pollInFlight = true;
    const seqAtStart = writeSeq;
    try{
      const data = await apiWithRetry('GET', { action:'list' });
      // If this browser saved something while the list was loading, the list is
      // already out of date — throw it away instead of overwriting the new save.
      if(seqAtStart !== writeSeq || writesInFlight > 0) return;
      pollFailures = 0;
      state.groups = data.groups || [];
      state.mode = 'remote';
      saveLocal();
      setSyncPill();
      // Don't yank the list/detail view out from under someone mid-edit.
      if(state.view !== 'edit') render();
    }catch(err){
      pollFailures++;
      console.warn('Group Summaries sync:', err && err.message);
      // One missed poll is usually a Google hiccup — only show Offline after two in a row.
      if(pollFailures >= 2 || state.mode !== 'remote'){
        state.mode = 'local';
        setSyncPill();
      }
      if(!silent) alertInline('Could not reach the shared sheet — showing your last synced copy. (' + err.message + ')', 'error');
    }finally{
      pollInFlight = false;
    }
  }

  async function initStorage(){
    loadLocal();
    render();
    await refreshFromServer(true);
    pollTimer = setInterval(function(){ if(!document.hidden) refreshFromServer(true); }, POLL_MS);
    // Catch up right away when someone comes back to the tab.
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshFromServer(true); });
  }

  async function persistGroup(g){
    if(!g.id) g.id = uid();
    g.updatedAt = new Date().toISOString();
    if(apiConfigured()){
      writeSeq++; writesInFlight++;
      try{
        const data = await apiWithRetry('POST', { action:'save', group:g });
        const saved = data.group || g;
        const idx = state.groups.findIndex(function(x){ return x.id === saved.id; });
        if(idx >= 0) state.groups[idx] = saved; else state.groups.push(saved);
        state.mode = 'remote';
        pollFailures = 0;
        saveLocal();
        setSyncPill();
        return saved.id;
      }finally{
        writeSeq++; writesInFlight--;
      }
    } else {
      const idx = state.groups.findIndex(function(x){ return x.id === g.id; });
      if(idx >= 0) state.groups[idx] = g; else state.groups.push(g);
      saveLocal();
      return g.id;
    }
  }

  async function deleteGroup(id){
    if(apiConfigured()){
      writeSeq++; writesInFlight++;
      try{
        await apiWithRetry('POST', { action:'delete', id:id });
      }catch(e){
        alertInline('Could not delete — ' + e.message);
        return;
      }finally{
        writeSeq++; writesInFlight--;
      }
    }
    state.groups = state.groups.filter(function(g){ return g.id !== id; });
    saveLocal();
    render();
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    setSyncPill();
    const app = document.getElementById('app');
    if(state.view === 'list') app.innerHTML = renderListView();
    else if(state.view === 'edit'){ renderEditView(app); sizeAutoGrow(app); }
    else if(state.view === 'detail') app.innerHTML = renderDetailView();
    else if(state.view === 'tasks') app.innerHTML = renderTasksView();
  }

  /* ---------------- list view ---------------- */
  function renderListResults(){
    let groups = state.groups.slice();
    if(state.search){
      const q = state.search.toLowerCase();
      groups = groups.filter(function(g){
        return (g.groupName||'').toLowerCase().includes(q) || (g.orgName||'').toLowerCase().includes(q);
      });
    }
    if(state.filter !== 'all'){
      groups = groups.filter(function(g){ return (g.status||'draft') === state.filter; });
    }
    if(state.monthFilter && state.monthFilter !== 'all'){
      groups = groups.filter(function(g){ return (monthYearKey(g.arrivalDate) || 'none') === state.monthFilter; });
    }
    if(state.yearFilter && state.yearFilter !== 'all'){
      groups = groups.filter(function(g){
        const k = monthYearKey(g.arrivalDate);
        return k && k.slice(0,4) === state.yearFilter;
      });
    }
    groups.sort(function(a,b){
      if(!a.arrivalDate) return 1;
      if(!b.arrivalDate) return -1;
      return a.arrivalDate.localeCompare(b.arrivalDate);
    });

    const rows = groups.map(function(g){
      const nights = nightsBetween(g.arrivalDate, g.departureDate);
      const dateStr = g.arrivalDate ? (fmtDateShort(g.arrivalDate) + (g.departureDate ? ' – ' + fmtDateShort(g.departureDate) : '') + (nights ? ' · ' + nights + ' nt' : '')) : 'Dates TBD';
      const statusClass = g.id === 'example-demo' ? 'example' : (g.status || 'draft');
      const statusLabel = g.id === 'example-demo' ? 'Example' : (g.status === 'confirmed' ? 'Confirmed' : 'Draft');
      const myKey = monthYearKey(g.arrivalDate);
      const myLabel = myKey ? monthYearLabel(myKey) : 'No arrival date';
      return '<div class="group-card" data-open="'+esc(g.id)+'">' +
        '<div class="gc-main"><div class="gc-name">'+esc(g.groupName||'Untitled group')+'</div><div class="gc-org">'+esc(g.orgName||'')+'</div></div>' +
        '<div class="gc-dates mono">'+esc(dateStr)+'</div>' +
        '<div class="gc-guests mono">'+(g.totalGuests? esc(g.totalGuests)+' guests':'—')+'</div>' +
        '<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">' +
          '<span class="pill monthyear">'+esc(myLabel)+'</span>' +
          '<span class="pill '+statusClass+'">'+statusLabel+'</span>' +
        '</div>' +
        '</div>';
    }).join('');

    return groups.length ? '<div class="group-list">'+rows+'</div>' :
      '<div class="empty-state">No groups match yet. <br><br><button class="btn primary" id="emptyNewBtn">+ New Summary</button></div>';
  }

  function buildMonthFilterOptionsHtml(){
    const keys = new Set();
    let hasNone = false;
    state.groups.forEach(function(g){
      const k = monthYearKey(g.arrivalDate);
      if(k) keys.add(k); else hasNone = true;
    });
    const sorted = Array.from(keys).sort();
    let html = sorted.map(function(k){
      return '<option value="'+k+'"'+(state.monthFilter===k?' selected':'')+'>'+esc(monthYearLabel(k))+'</option>';
    }).join('');
    if(hasNone){
      html += '<option value="none"'+(state.monthFilter==='none'?' selected':'')+'>No arrival date</option>';
    }
    return html;
  }

  /* ---------------- edit view ---------------- */
  function tableRowHtml(path, i, row, columns){
    const cells = columns.map(function(c){
      const val = esc(row[c.key] || '');
      if(c.type === 'select'){
        const opts = c.options.map(function(o){ return '<option value="'+esc(o)+'"'+(row[c.key]===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
        return '<td><select data-bind="'+path+'.'+i+'.'+c.key+'"><option value=""></option>'+opts+'</select></td>';
      }
      if(c.type === 'checkbox'){
        return '<td style="text-align:center;"><input type="checkbox" data-bind="'+path+'.'+i+'.'+c.key+'" '+(row[c.key]?'checked':'')+'></td>';
      }
      if(c.type === 'autogrow'){
        return '<td><textarea class="autogrow" rows="1" data-bind="'+path+'.'+i+'.'+c.key+'" placeholder="'+esc(c.placeholder||'')+'">'+val+'</textarea></td>';
      }
      if(c.type === 'datalist'){
        return '<td><input data-bind="'+path+'.'+i+'.'+c.key+'" type="text" list="'+esc(c.listId)+'" placeholder="'+esc(c.placeholder||'')+'" value="'+val+'"></td>';
      }
      return '<td><input data-bind="'+path+'.'+i+'.'+c.key+'" type="'+(c.type||'text')+'" placeholder="'+esc(c.placeholder||'')+'" value="'+val+'"></td>';
    }).join('');
    return '<tr>'+cells+'<td><button type="button" class="row-del" data-remove="'+path+'.'+i+'" title="Remove row">✕</button></td></tr>';
  }

      input = '<select data-bind="'+path+'">'+optHtml+'</select>';
    } else {
      input = '<input data-bind="'+path+'" type="'+type+'" value="'+esc(val==null?'':val)+'" placeholder="'+esc(opts.placeholder||'')+'">';
    }
    return '<label class="field'+(opts.wide?' wide':'')+'"><span>'+esc(label)+'</span>'+input+'</label>';

  async function saveCurrentDraft(btn){
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      const id = await persistGroup(draft);
      state.currentId = id;
      state.view = 'detail';
      draft = null;
      render();
    }catch(err){
      btn.disabled = false; btn.textContent = 'Save Summary';
      alertInline('Could not save — ' + (err && err.message ? err.message : 'please try again.'));
    }
  }

  function alertInline(msg, kind){
    kind = kind || 'error';
    const app = document.getElementById('app');
    const box = document.createElement('div');
    box.className = 'section-card';
    const color = kind === 'success' ? 'var(--good)' : 'var(--danger)';
    box.style.borderColor = color;
    box.style.color = color;
    box.textContent = msg;
    app.prepend(box);
    if(kind !== 'success'){
      box.style.position = 'sticky'; box.style.top = '10px'; box.style.zIndex = '50';
      box.style.background = 'var(--danger-soft, #fdecea)';
      try{ box.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
    }
    setTimeout(function(){ box.remove(); }, kind === 'success' ? 4500 : 12000);
  }

  function findGroup(id){ return state.groups.find(function(g){ return g.id === id; }); }

  function detailTable(rows, columns){
    if(!rows || !rows.length) return '<p class="muted-note">Nothing recorded yet.</p>';
    const head = columns.map(function(c){ return '<th>'+esc(c.label)+'</th>'; }).join('');
    const body = rows.map(function(r){ return '<tr>'+columns.map(function(c){
      const raw = r[c.key];
      const val = c.format ? c.format(raw, r) : raw;
      return '<td>'+esc(val==null||val===''?'—':val)+'</td>';
    }).join('')+'</tr>'; }).join('');
    return '<div class="table-wrap"><table class="detail-table"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function pdfSectionHeader(doc, text, x, y){
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(14,124,134);
    doc.text(text, x, y);
    doc.setDrawColor(210,225,220); doc.setLineWidth(0.75);
    doc.line(x, y+4, 558, y+4);
    doc.setTextColor(20,30,28);
    return y + 18;
  }

  function pdfKvPairs(doc, pairs, x, y, colWidth){
    doc.setFontSize(9);
    let col = 0, rowY = y, startY = y;
    pairs.forEach(function(p, i){
      const cx = x + col*colWidth;
      doc.setFont('helvetica','bold'); doc.setTextColor(120,140,135);
      doc.text(p[0].toUpperCase(), cx, rowY);
      doc.setFont('helvetica','normal'); doc.setTextColor(20,30,28);
      doc.text(String(p[1]||'—'), cx, rowY+12);
      col++;
      if(col >= 3){ col = 0; rowY += 28; }
    });
    if(col !== 0) rowY += 28;
    return rowY + 4;
  }

  function pdfTable(doc, x, y, columns, rows, opts){
    opts = opts || {};
    const fontSize = 8.3, padX = 5, lineH = 10.5, pageBottom = 760;
    doc.setFontSize(fontSize);
    if(!rows || !rows.length){
      doc.setFont('helvetica','italic'); doc.setTextColor(140,155,150);
      doc.text('Nothing recorded.', x, y+10);
      doc.setTextColor(20,30,28);
      return y + 20;
    }
    function drawHeader(hy){
      doc.setFillColor(234,240,238);
      doc.rect(x, hy, columns.reduce(function(s,c){return s+c.width;},0), 16, 'F');
      doc.setFont('helvetica','bold'); doc.setTextColor(74,92,85);
      let cx = x;
      columns.forEach(function(c){ doc.text(c.label.toUpperCase(), cx+padX, hy+10.5); cx += c.width; });
      doc.setTextColor(20,30,28);
      return hy + 16;
    }
    let curY = drawHeader(y);
    rows.forEach(function(row){
      const cellLines = columns.map(function(c){
        const val = String(row[c.key] || '—');
        return doc.splitTextToSize(val, c.width - padX*2);
      });
      const maxLines = Math.max.apply(null, cellLines.map(function(l){ return l.length; }));
      const rowH = Math.max(16, maxLines*lineH + 6);
      if(curY + rowH > pageBottom){
        doc.addPage();
        curY = 50;
        curY = drawHeader(curY);
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(fontSize);
      let cx = x;
      columns.forEach(function(c, ci){
        doc.text(cellLines[ci], cx+padX, curY+11);
        cx += c.width;
      });
      doc.setDrawColor(215,225,221); doc.setLineWidth(0.4);
      doc.line(x, curY+rowH, x + columns.reduce(function(s,c){return s+c.width;},0), curY+rowH);
      curY += rowH;
    });
    return curY + 12;
  }

  function pdfProse(doc, text, x, y, width){
    if(!text) return y;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(74,92,85);
    const lines = doc.splitTextToSize(text, width);
    if(y + lines.length*11 > 770){ doc.addPage(); y = 50; }
    doc.text(lines, x, y);
    doc.setTextColor(20,30,28);
    return y + lines.length*11 + 10;
  }

  function pdfEventSpaceSession(doc, s, x, y, width){
    const headerLine = [formatDateRange(s.day, s.dayEnd), timeRangeLabel(s.time, s.timeEnd), s.session].filter(Boolean).join('  ·  ') || 'Session';
    const lines = [];
    if(s.orientation) lines.push('Orientation: ' + s.orientation + (s.orientation === 'Custom' && s.orientationNotes ? ' — ' + s.orientationNotes : ''));
    if(s.spaces && s.spaces.length) lines.push('Space: ' + s.spaces.join(', '));
    if(s.tableTypes && s.tableTypes.length) lines.push('Tables: ' + s.tableTypes.join(', ') + (s.numTables ? ' (' + s.numTables + ')' : ''));
    if(s.chairTypes && s.chairTypes.length) lines.push('Chairs: ' + s.chairTypes.join(', ') + (s.numChairs ? ' (' + s.numChairs + ')' : ''));
    if(s.avNeeds && s.avNeeds.length) lines.push('AV/Equipment: ' + s.avNeeds.join(', '));
    if(s.staff && s.staff.length) lines.push('Staff: ' + s.staff.join(', '));
    if(s.notes) lines.push('Notes: ' + s.notes);
    const bodyText = lines.length ? lines.join('   |   ') : 'No details recorded.';
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    const wrapped = doc.splitTextToSize(bodyText, width);
    const blockHeight = 13 + wrapped.length*11 + 8;
    if(y + blockHeight > 760){ doc.addPage(); y = 50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(20,30,28);
    doc.text(headerLine, x, y);
    y += 13;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(74,92,85);
    doc.text(wrapped, x, y);
    doc.setTextColor(20,30,28);
    return y + wrapped.length*11 + 8;
  }

  function buildPdf(g){
    const doc = new window.jspdf.jsPDF({ unit:'pt', format:'letter' });
    const marginX = 40; let y = 46;
    const pageW = 612;

    doc.setFillColor(14,124,134);
    doc.rect(0,0,pageW,4,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(14,124,134);
    doc.text('EPIC BEAR LAKE RETREATS', marginX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(140,155,150);
    doc.text('Group Summary · generated ' + new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), pageW-marginX, y, {align:'right'});
    y += 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(20,30,28);
    doc.text(g.groupName || 'Untitled group', marginX, y);
    y += 16;
    if(g.orgName){ doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,105,100); doc.text(g.orgName, marginX, y); y += 14; }
    doc.setDrawColor(210,225,220); doc.setLineWidth(1); doc.line(marginX, y+2, pageW-marginX, y+2);
    y += 22;

    const nights = nightsBetween(g.arrivalDate, g.departureDate);
    y = pdfSectionHeader(doc, '1. Group & Contact', marginX, y);
    y = pdfKvPairs(doc, [
      ['Arrival', fmtDate(g.arrivalDate)], ['Departure', fmtDate(g.departureDate)], ['Length of stay', nights? nights+' nights':'—'],
      ['Total guests', g.totalGuests], ['Coordinator', g.coordinator], ['Status', g.status==='confirmed'?'Confirmed':'Draft'],
      ['Contact', g.contactName], ['Phone', g.contactPhone], ['Email', g.contactEmail]
    ], marginX, y, 170);

    y = pdfSectionHeader(doc, '2. Transportation & Arrival', marginX, y);
    y = pdfKvPairs(doc, [['Mode', g.transportation.mode], ['Shuttle needed', g.transportation.shuttleNeeded?'Yes':'No']], marginX, y, 260);
    y = pdfProse(doc, [g.transportation.arrivalDetails, g.transportation.departureDetails, g.transportation.notes].filter(Boolean).join('   |   '), marginX, y, pageW-marginX*2);

    y = pdfSectionHeader(doc, '3. Lodging', marginX, y);
    y = pdfKvPairs(doc, [['Properties', g.lodging.properties.join(', ') || '—'], ['Check-in', g.lodging.checkIn], ['Check-out', g.lodging.checkOut]], marginX, y, 260);
    y = pdfTable(doc, marginX, y, [{key:'unit',label:'Unit',width:150},{key:'occupants',label:'Occupants',width:210},{key:'notes',label:'Notes',width:172}], g.lodging.assignments);
    if(g.lodging.attachments && g.lodging.attachments.length){
      y = pdfProse(doc, 'Attached in the tool (open the group\'s page to download): ' + g.lodging.attachments.map(function(a){return a.name;}).join(', '), marginX, y, pageW-marginX*2);
    }
    y = pdfProse(doc, g.lodging.notes, marginX, y, pageW-marginX*2);

    y = pdfSectionHeader(doc, '4. Catering', marginX, y);
    y = pdfProse(doc, g.catering.dietary ? 'Dietary/allergies: '+g.catering.dietary : '', marginX, y, pageW-marginX*2);
    if(g.catering.vendor) y = pdfProse(doc, 'Vendor: '+g.catering.vendor, marginX, y, pageW-marginX*2);
    y = pdfTable(doc, marginX, y, [{key:'day',label:'Day',width:70},{key:'meal',label:'Meal',width:60},{key:'time',label:'Time',width:55},{key:'location',label:'Location',width:130},{key:'headcount',label:'Count',width:45},{key:'notes',label:'Notes',width:172}], g.catering.meals);
    y = pdfProse(doc, g.catering.notes, marginX, y, pageW-marginX*2);

    y = pdfSectionHeader(doc, '5. Recreation', marginX, y);
    y = pdfTable(doc, marginX, y, [{key:'day',label:'Day',width:65},{key:'time',label:'Time',width:55},{key:'activity',label:'Activity',width:120},{key:'location',label:'Location',width:110},{key:'staff',label:'Staff',width:75},{key:'notes',label:'Notes',width:107}], g.recreation.activities);

    y = pdfSectionHeader(doc, '6. Event Space', marginX, y);
    if(!g.eventSpace.schedule || !g.eventSpace.schedule.length){
      y = pdfProse(doc, 'Nothing recorded.', marginX, y, pageW-marginX*2);
    } else {
      g.eventSpace.schedule.forEach(function(s){ y = pdfEventSpaceSession(doc, s, marginX, y, pageW-marginX*2); });
    }
    y = pdfProse(doc, g.eventSpace.notes, marginX, y, pageW-marginX*2);

    y = pdfSectionHeader(doc, '7. Master Itinerary', marginX, y);
    y = pdfProse(doc, g.itineraryNotes || 'Nothing recorded.', marginX, y, pageW-marginX*2);
    if(g.itineraryAttachments && g.itineraryAttachments.length){
      y = pdfProse(doc, 'Attached in the tool (open the group\'s page to download): ' + g.itineraryAttachments.map(function(a){return a.name;}).join(', '), marginX, y, pageW-marginX*2);
    }

    y = pdfSectionHeader(doc, '8. Staffing & Vendors', marginX, y);
    y = pdfTable(doc, marginX, y, [{key:'name',label:'Name',width:170},{key:'role',label:'Role',width:210},{key:'shift',label:'Day / shift',width:152}], g.staffing.internal);
    y = pdfTable(doc, marginX, y, [{key:'name',label:'Vendor',width:170},{key:'service',label:'Service',width:210},{key:'contact',label:'Contact',width:152}], g.staffing.vendors);

    y = pdfSectionHeader(doc, '9. Communication Log', marginX, y);
    y = pdfTable(doc, marginX, y, [{key:'date',label:'Date',width:70},{key:'contactName',label:'Group contact',width:120},{key:'staffName',label:'Our staff',width:120},{key:'notes',label:'Notes',width:222}],
      (g.communicationLog||[]).map(function(c){ return { date: fmtDateShort(c.date), contactName:c.contactName, staffName:c.staffName, notes:c.notes }; }));

    y = pdfSectionHeader(doc, '10. Tasks', marginX, y);
    y = pdfTable(doc, marginX, y, [{key:'task',label:'Task',width:220},{key:'assignee',label:'Assigned to',width:120},{key:'dueDate',label:'Due',width:70},{key:'status',label:'Status',width:122}],
      (g.tasks||[]).map(function(t){ return { task:t.task, assignee:t.assignee, dueDate:fmtDateShort(t.dueDate), status:t.done?'Done':'Open' }; }));

    if(g.specialNotes){
      y = pdfSectionHeader(doc, '11. Special Notes', marginX, y);
      y = pdfProse(doc, g.specialNotes, marginX, y, pageW-marginX*2);
    }

    y = pdfSectionHeader(doc, '12. Event & Lodging Agreements', marginX, y);
    if(g.agreements && g.agreements.length){
      y = pdfProse(doc, 'Attached in the tool (open the group\'s page to download): ' + g.agreements.map(function(a){return a.name;}).join(', '), marginX, y, pageW-marginX*2);
    } else {
      y = pdfProse(doc, 'No agreements attached.', marginX, y, pageW-marginX*2);
    }

    return doc;
  }

  function exportPdf(g, btn){
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Building…';
    try{
      if(typeof window.jspdf === 'undefined'){
        throw new Error('The PDF library didn\'t load — check your connection and refresh the page.');
      }
      const doc = buildPdf(g);
      const safeName = (g.groupName||'group-summary').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'group-summary';
      const dateStr = g.arrivalDate || new Date().toISOString().slice(0,10);
      doc.save(safeName + '-' + dateStr + '.pdf');
      btn.textContent = 'Saved ✓';
      setTimeout(function(){ btn.textContent = original; btn.disabled = false; }, 1800);
    }catch(err){
      btn.disabled = false; btn.textContent = original;
      alertInline('Could not export PDF — ' + (err && err.message ? err.message : 'please try again.'));
    }
  }

  function downloadAttachment(groupId, path, idx, btn){
    const g = findGroup(groupId);
    const atts = g ? getPath(g, path) : null;
    const att = atts && atts[idx];
    if(!att) return;
    if(att.url){
      // Attachment lives in Google Drive — just open it.
      window.open(att.url, '_blank', 'noopener');
      return;
    }
    if(att.dataUrl){
      // Offline-only fallback: the file never made it to Drive (no connection at the time),
      // so it's just base64 sitting in this browser's local copy. Trigger a normal download.
      const a = document.createElement('a');
      a.href = att.dataUrl;
      a.download = att.name || 'file';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }
    alertInline('Could not find that file.');
  }

  function attachmentListElId(path){
    if(path === 'lodging.attachments') return 'lodgingAttachmentList';
    if(path === 'agreements') return 'agreementAttachmentList';
    return 'itineraryAttachmentList';
  }

  async function handleAttachmentUpload(path, fileList){
    const current = getPath(draft, path) || [];
    const files = Array.prototype.slice.call(fileList || []);
    const listId = attachmentListElId(path);
    const list = document.getElementById(listId);
    for(let i=0;i<files.length;i++){
      const file = files[i];
      if(file.size > MAX_ATTACHMENT_BYTES){
        alertInline('"'+file.name+'" is too large to attach here ('+formatBytes(MAX_ATTACHMENT_BYTES)+' max) — keep it in your shared drive and note where it is.');
        continue;
      }
      if(list) list.innerHTML = '<p class="muted-note" style="margin:6px 0 0;">Uploading "'+esc(file.name)+'"…</p>';
      try{
        if(apiConfigured()){
          const dataUrl = await readFileAsDataURL(file);
          const base64 = dataUrl.split(',')[1] || '';
          const data = await apiRequest('POST', {
            action:'uploadAttachment', name:file.name, mimeType:file.type, base64:base64
          });
          current.push(data.attachment);
        } else {
          // No shared backend configured yet — keep the file inline so at least this browser has it.
          const dataUrl = await readFileAsDataURL(file);
          current.push({ name:file.name, type:file.type, size:file.size, dataUrl:dataUrl });
        }
      }catch(e){
        alertInline('Could not upload "'+file.name+'" — ' + (e && e.message ? e.message : 'please try again.'));
      }
    }
    setPath(draft, path, current);
    if(list) list.innerHTML = renderAttachmentEditList(path);
  }

  /* ---------------- tasks overview ---------------- */
  function renderTasksView(){
    const flat = [];
    state.groups.forEach(function(g){
      (g.tasks || []).forEach(function(t, idx){
        flat.push({
          groupId:g.id, groupName:g.groupName||'Untitled group',
          task:t.task, assignee:(t.assignee||'').trim() || 'Unassigned',
          dueDate:t.dueDate, done:!!t.done, taskIndex:idx
        });
      });
    });
    if(!flat.length){
      return '<div class="list-head"><div><h1>Tasks</h1><p>Every task from every group summary, in one place.</p></div></div>' +
        '<div class="empty-state">No tasks yet. Add tasks from a group\'s Edit page — they\'ll show up here automatically.</div>';
    }
    const byAssignee = {};
    flat.forEach(function(t){ (byAssignee[t.assignee] = byAssignee[t.assignee] || []).push(t); });
    const assignees = Object.keys(byAssignee).sort(function(a,b){
      if(a === 'Unassigned') return 1;
      if(b === 'Unassigned') return -1;
      return a.localeCompare(b);
    });
    const sections = assignees.map(function(name){
      const tasks = byAssignee[name].slice().sort(function(a,b){
        if(a.done !== b.done) return a.done ? 1 : -1;
        if(!a.dueDate) return 1;
        if(!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      });
      const openCount = tasks.filter(function(t){ return !t.done; }).length;
      const rows = tasks.map(function(t){
        return '<tr'+(t.done?' style="opacity:.5;"':'')+'>' +
          '<td style="width:28px;"><input type="checkbox" data-toggle-task="'+esc(t.groupId)+'::'+t.taskIndex+'" '+(t.done?'checked':'')+'></td>' +
          '<td'+(t.done?' style="text-decoration:line-through;"':'')+'>'+esc(t.task||'Untitled task')+'</td>' +
          '<td class="mono">'+esc(fmtDateShort(t.dueDate))+'</td>' +
          '<td><a href="#" data-open="'+esc(t.groupId)+'" style="color:var(--accent); font-weight:600; text-decoration:none;">'+esc(t.groupName)+'</a></td>' +
        '</tr>';
      }).join('');
      return '<div class="section-card"><div class="section-title"><span class="task-count">'+openCount+'</span> '+esc(name)+'</div>' +
        '<div class="table-wrap"><table class="detail-table"><thead><tr><th></th><th>Task</th><th>Due</th><th>Group</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '</div>';
    }).join('');
    return '<div class="list-head"><div><h1>Tasks</h1><p>Every task from every group summary, organized by who it\'s assigned to.</p></div></div>' + sections;
  }

  async function toggleTaskDone(groupId, idx, doneVal){
    const g = findGroup(groupId);
    if(!g || !g.tasks || !g.tasks[idx]) return;
    const copy = JSON.parse(JSON.stringify(g));
    copy.tasks[idx].done = doneVal;
    try{
      await persistGroup(copy);
      if(state.mode !== 'db') render();
    }catch(err){
      alertInline('Could not update that task — please try again.');
    }
  }

  /* ---------------- global click/nav handlers (bound ONCE — #app itself is never replaced) ---------------- */
  function startNew(){
    draft = emptyGroup();
    state.view = 'edit';
    render();
  }

  function handleAppClick(e){
    const add = e.target.closest('[data-add]');
    const remove = e.target.closest('[data-remove]');
    const card = e.target.closest('[data-open]');
    const removeAtt = e.target.closest('[data-remove-attachment]');
    const dlAtt = e.target.closest('[data-download-attachment]');
    const yearTab = e.target.closest('[data-year-tab]');

    if(state.view === 'list' && yearTab){
      state.yearFilter = yearTab.dataset.yearTab;
      state.monthFilter = 'all';
      const tabsRow = document.getElementById('yearTabsRow');
      if(tabsRow) tabsRow.outerHTML = renderYearTabsHtml();
      const monthSel = document.getElementById('monthFilterSelect');
      if(monthSel) monthSel.value = 'all';
      document.getElementById('resultsContainer').innerHTML = renderListResults();
      return;
    }

    if(state.view === 'edit' && add){
      const path = add.dataset.add;
      const arr = getPath(draft, path) || [];
      arr.push(defaultRowFor(path));
      setPath(draft, path, arr);
      refreshTable(path);
      return;
    }
    if(state.view === 'edit' && remove){
      const full = remove.dataset.remove;
      const lastDot = full.lastIndexOf('.');
      const path = full.slice(0, lastDot);
      const idx = Number(full.slice(lastDot+1));
      const arr = getPath(draft, path) || [];
      arr.splice(idx,1);
      setPath(draft, path, arr);
      if(path === 'eventSpace.schedule') refreshEventSpaceSessions(); else refreshTable(path);
      return;
    }
    if(state.view === 'edit' && e.target.id === 'addEventSpaceSession'){
      draft.eventSpace.schedule = draft.eventSpace.schedule || [];
      draft.eventSpace.schedule.push(newEventSpaceSession());
      refreshEventSpaceSessions();
      return;
    }
    if(state.view === 'edit' && removeAtt){
      const full = removeAtt.dataset.removeAttachment;
      const lastDot = full.lastIndexOf('.');
      const path = full.slice(0, lastDot);
      const idx = Number(full.slice(lastDot+1));
      const arr = getPath(draft, path) || [];
      arr.splice(idx,1);
      setPath(draft, path, arr);
      const list = document.getElementById(attachmentListElId(path));
      if(list) list.innerHTML = renderAttachmentEditList(path);
      return;
    }
    if(state.view === 'edit' && e.target.id === 'lodgingUploadBtn'){
      document.getElementById('lodgingFileInput').click();
      return;
    }
    if(state.view === 'edit' && e.target.id === 'itineraryUploadBtn'){
      document.getElementById('itineraryFileInput').click();
      return;
    }
    if(state.view === 'edit' && e.target.id === 'agreementUploadBtn'){
      document.getElementById('agreementFileInput').click();
      return;
    }
    if(dlAtt){
      const parts = dlAtt.dataset.downloadAttachment.split('::');
      const pathAndIdx = parts[1];
      const lastDot = pathAndIdx.lastIndexOf('.');
      downloadAttachment(parts[0], pathAndIdx.slice(0, lastDot), Number(pathAndIdx.slice(lastDot+1)), dlAtt);
      return;
    }
    if(e.target.id === 'cancelEditBtn'){
      state.view = draft && draft.id ? 'detail' : 'list';
      draft = null;
      render();
      return;
    }
    if(e.target.id === 'saveGroupBtn'){ saveCurrentDraft(e.target); return; }
    if(e.target.id === 'emptyNewBtn'){ startNew(); return; }
    if(card){ e.preventDefault(); state.currentId = card.dataset.open; state.view = 'detail'; render(); return; }
    if(e.target.id === 'backToListBtn'){ state.view = 'list'; render(); return; }
    if(e.target.id === 'editGroupBtn'){ draft = JSON.parse(JSON.stringify(findGroup(state.currentId))); state.view = 'edit'; render(); return; }
    if(e.target.id === 'duplicateGroupBtn'){
      const copy = JSON.parse(JSON.stringify(findGroup(state.currentId)));
      delete copy.id; copy.status = 'draft'; copy.groupName = copy.groupName + ' (copy)';
      draft = copy; state.view = 'edit'; render(); return;
    }
    if(e.target.id === 'exportPdfBtn' && !e.target.disabled){ exportPdf(findGroup(state.currentId), e.target); return; }
    if(e.target.id === 'deleteGroupBtn'){
      if(e.target.dataset.armed === '1'){
        const id = state.currentId;
        state.view = 'list'; render();
        deleteGroup(id);
      } else {
        e.target.dataset.armed = '1';
        e.target.textContent = 'Click again to confirm';
        setTimeout(function(){ if(e.target){ e.target.dataset.armed='0'; e.target.textContent='Delete'; } }, 4000);
      }
      return;
    }
  }

  function handleAppInputOrChange(e){
    const t = e.target;
    if(t.id === 'searchInput'){
      state.search = t.value;
      document.getElementById('resultsContainer').innerHTML = renderListResults();
      return;
    }
    if(t.id === 'filterSelect'){
      state.filter = t.value;
      document.getElementById('resultsContainer').innerHTML = renderListResults();
      return;
    }
    if(t.id === 'monthFilterSelect'){
      state.monthFilter = t.value;
      document.getElementById('resultsContainer').innerHTML = renderListResults();
      return;
    }
    if(t.id === 'lodgingFileInput'){
      handleAttachmentUpload('lodging.attachments', t.files);
      t.value = '';
      return;
    }
    if(t.id === 'itineraryFileInput'){
      handleAttachmentUpload('itineraryAttachments', t.files);
      t.value = '';
      return;
    }
    if(t.id === 'agreementFileInput'){
      handleAttachmentUpload('agreements', t.files);
      t.value = '';
      return;
    }
    if(t.dataset.toggleTask){
      const parts = t.dataset.toggleTask.split('::');
      toggleTaskDone(parts[0], Number(parts[1]), t.checked);
      return;
    }
    if(state.view !== 'edit' || !draft) return;
    if(t.classList && t.classList.contains('autogrow')) autoGrow(t);
    if(t.dataset.bind){
      let val = t.value;
      if(t.type === 'checkbox') val = t.checked;
      else if(t.type === 'number') val = t.value === '' ? '' : Number(t.value);
      setPath(draft, t.dataset.bind, val);
      if(/\.orientation$/.test(t.dataset.bind)){
        const subcard = t.closest('.subcard');
        const notesField = subcard && subcard.querySelector('[data-orientation-notes]');
        if(notesField) notesField.style.display = (val === 'Custom') ? '' : 'none';
      }
    } else if(t.dataset.toggleArray){
      const arr = getPath(draft, t.dataset.toggleArray) || [];
      const v = t.dataset.value;
      const idx = arr.indexOf(v);
      if(t.checked && idx === -1) arr.push(v);
      if(!t.checked && idx !== -1) arr.splice(idx,1);
      setPath(draft, t.dataset.toggleArray, arr);
    }
  }

  const appEl = document.getElementById('app');
  appEl.addEventListener('click', handleAppClick);
  appEl.addEventListener('input', handleAppInputOrChange);
  appEl.addEventListener('change', handleAppInputOrChange);
  window.addEventListener('resize', function(){ if(state.view === 'edit') sizeAutoGrow(appEl); });
  document.getElementById('navList').addEventListener('click', function(){ state.view='list'; draft=null; render(); });
  document.getElementById('navTasks').addEventListener('click', function(){ state.view='tasks'; draft=null; render(); });
  document.getElementById('navNew').addEventListener('click', startNew);

  initStorage();
})();
</script>

</body></html>
