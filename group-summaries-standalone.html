<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Group Summaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0EE; --border:#D7E1DD;
    --ink:#16231F; --ink-soft:#4A5C55; --muted:#7C8F88;
    --accent:#0E7C86; --accent-ink:#063C41; --accent-soft:#E1F2F1;
    --warm:#C97C3D; --warm-soft:#FBEEE0;
    --good:#3E7A4E; --good-soft:#E7F3EA;
    --danger:#B0473F; --danger-soft:#FAEAE8;
    --shadow:0 1px 2px rgba(15,35,30,.07), 0 10px 28px -14px rgba(15,35,30,.22);
    --radius:10px; --radius-sm:6px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1613; --surface:#16211D; --surface-2:#1C2925; --border:#2A3B35;
      --ink:#E7EFEC; --ink-soft:#B7C7C1; --muted:#7E958D;
      --accent:#4FC2C9; --accent-ink:#DFFAF9; --accent-soft:#163538;
      --warm:#E0996A; --warm-soft:#3A2A1B;
      --good:#7CC28D; --good-soft:#1B3423;
      --danger:#E28880; --danger-soft:#3A201D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1613; --surface:#16211D; --surface-2:#1C2925; --border:#2A3B35;
    --ink:#E7EFEC; --ink-soft:#B7C7C1; --muted:#7E958D;
    --accent:#4FC2C9; --accent-ink:#DFFAF9; --accent-soft:#163538;
    --warm:#E0996A; --warm-soft:#3A2A1B;
    --good:#7CC28D; --good-soft:#1B3423;
    --danger:#E28880; --danger-soft:#3A201D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface);}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.15;}
  .brand-sub{font-size:12px; color:var(--muted); letter-spacing:.02em;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .sync-pill{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
    padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border);
  }
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--good);}
  .sync-pill.local .sync-dot{background:var(--warm);}
  .tabs{display:flex; gap:8px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:600; transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.ghost:hover{background:var(--surface-2); border-color:var(--border);}
  .btn.ghost.active{background:var(--accent-soft); color:var(--accent-ink);}
  .btn.danger-hover:hover{border-color:var(--danger); color:var(--danger);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .btn:hover[disabled]{border-color:var(--border); background:var(--surface); color:var(--ink);}
  .btn svg{width:15px; height:15px; flex:none;}

  main{max-width:1120px; margin:0 auto; padding:28px 24px 80px;}

  /* ---------- List view ---------- */
  .list-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
  .list-head h1{font-size:26px;}
  .list-head p{margin:4px 0 0; color:var(--muted); font-size:13.5px;}
  .list-controls{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .search-input{
    flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink);
  }
  .filter-select{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);}
  .year-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .year-tab{
    padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-size:13px; font-weight:600; transition:border-color .15s, background .15s, color .15s;
  }
  .year-tab:hover{border-color:var(--accent); color:var(--ink);}
  .year-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .group-list{display:flex; flex-direction:column; gap:10px;}
  .group-card{
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .group-card:hover{border-color:var(--accent);}
  .group-card:active{transform:scale(.997);}
  .gc-main{min-width:0;}
  .gc-name{font-weight:700; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gc-org{color:var(--muted); font-size:13px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gc-dates{font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .gc-guests{font-size:13px; color:var(--ink-soft); white-space:nowrap; text-align:right;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px; white-space:nowrap;
  }
  .pill.draft{background:var(--warm-soft); color:var(--warm);}
  .pill.confirmed{background:var(--good-soft); color:var(--good);}
  .pill.example{background:var(--surface-2); color:var(--muted);}
  .pill.monthyear{background:var(--accent-soft); color:var(--accent-ink);}
  .pill.category{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}
  .category-tabs{display:flex; gap:6px; margin:-4px 0 14px; flex-wrap:wrap; align-items:center;}
  .category-tabs .ct-label{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-right:4px;}
  .pill.company{background:var(--warm-soft); color:var(--warm);}
  .company-bar{
    display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--warm);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; margin-bottom:16px;
  }
  .company-bar .cb-label{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .company-bar label{display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600;}
  .customer-bar{
    background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:16px; display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;
  }
  .customer-bar .field{flex:1; min-width:240px;}
  .customer-bar input{padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);}
  .customer-bar .cb-hint{font-size:12.5px; color:var(--accent-ink); flex-basis:100%; margin:0;}
  .legacy-note{font-size:11.5px; color:var(--muted); font-style:italic; margin-top:3px;}
  .customer-card{grid-template-columns:1fr auto auto;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted); border:1px dashed var(--border); border-radius:var(--radius);
  }

  /* ---------- Section cards (edit + detail) ---------- */
  .section-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px;
  }
  .section-title{
    display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700;
    color:var(--accent-ink); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .section-index{
    width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;
    font-family:'IBM Plex Mono',monospace;
  }
  .field-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field span{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  }
  .field textarea{resize:vertical; min-height:56px;}
  textarea.autogrow{resize:none; overflow:hidden; line-height:1.45;}
  .field textarea.autogrow.oneline, .row-table td textarea.autogrow.oneline{min-height:0; white-space:pre-wrap; overflow-wrap:anywhere;}
  .field.wide{grid-column:1 / -1;}
  .check-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:4px;}
  .check-row label{display:flex; align-items:center; gap:6px; font-size:13.5px;}

  .row-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .row-table th{
    text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); padding:0 8px 6px; border-bottom:1px solid var(--border);
  }
  .row-table td{padding:4px 6px; vertical-align:top;}
  .row-table td input, .row-table td select{width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px;}
  .row-table td textarea.autogrow{
    display:block; width:100%; min-height:32px; padding:6px 8px; border:1px solid var(--border); border-radius:6px;
    font:inherit; line-height:1.45; resize:none; overflow:hidden; box-sizing:border-box;
  }
  .row-del{background:transparent; border:none; color:var(--muted); font-size:15px; padding:6px; border-radius:6px;}
  .row-del:hover{color:var(--danger); background:var(--danger-soft);}
  .add-row-btn{
    margin-top:8px; font-size:12.5px; font-weight:600; color:var(--accent); background:var(--accent-soft);
    border:none; padding:7px 12px; border-radius:var(--radius-sm);
  }
  .add-row-btn:hover{background:var(--accent); color:#fff;}
  .table-wrap{overflow-x:auto;}

  .edit-actions{
    position:sticky; bottom:0; display:flex; justify-content:flex-end; gap:10px;
    padding:14px 0 4px; background:linear-gradient(to top, var(--bg) 60%, transparent);
  }

  /* ---------- Detail view ---------- */
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:18px; flex-wrap:wrap;
  }
  .detail-title h1{font-size:25px; margin-bottom:5px;}
  .detail-title .gc-org{font-size:14px;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .kv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px 22px;}
  .kv{display:flex; flex-direction:column; gap:2px;}
  .kv-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .kv-value{font-size:14.5px; font-weight:600;}
  .kv-value.mono{font-weight:500;}
  .detail-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .detail-table th{
    text-align:left; padding:7px 10px; background:var(--surface-2); color:var(--ink-soft);
    font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--border);
  }
  .detail-table td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; white-space:pre-wrap; overflow-wrap:anywhere;}
  .detail-table tr:last-child td{border-bottom:none;}
  .prose{white-space:pre-wrap; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{background:var(--accent-soft); color:var(--accent-ink); font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .muted-note{color:var(--muted); font-size:13px; font-style:italic;}
  textarea[data-bind="itineraryNotes"]{min-height:180px;}
  .attachment-card{width:160px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2);}
  .attachment-card img{width:100%; max-height:120px; object-fit:cover; display:block;}
  .attachment-card .ac-body{padding:8px 10px;}
  .attachment-card .ac-name{font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attachment-row{display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--surface-2); border-radius:6px; font-size:13px; margin-bottom:6px;}
  .attachment-row span.name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .subcard{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:12px; background:var(--surface-2); }
  .subcard-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .subcard-title{ font-size:11.5px; font-weight:700; color:var(--accent-ink); text-transform:uppercase; letter-spacing:.04em; }
  .subcard .field-grid{ margin-bottom:10px; }
  .subcard .field span{ font-size:11px; }
  .task-count{
    min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace;
  }

  @media print{
    .topbar, .detail-actions{display:none !important;}
    main{max-width:none; padding:0;}
    .section-card{box-shadow:none; break-inside:avoid;}
  }
  @media (max-width:640px){
    .topbar{flex-wrap:wrap; padding:12px 16px; gap:10px;}
    .topbar-right{flex-wrap:wrap; gap:8px; width:100%; justify-content:space-between;}
    .tabs{flex-wrap:wrap; gap:4px;}
    .tabs .btn{padding:7px 10px; font-size:13px;}
    .group-card{grid-template-columns:1fr; align-items:flex-start; gap:8px;}
    .gc-guests{text-align:left;}
  }
</style>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="9" fill="var(--accent-soft)"/>
      <path d="M6 26L14 15L19 21L24 13L34 26" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      <path d="M4 30C7 28 9.5 28 12.5 30C15.5 32 18 32 21 30C24 28 26.5 28 29.5 30C32.5 32 34 32 36 30" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </svg>
    <div>
      <div class="brand-name">Epic Bear Lake Retreats</div>
      <div class="brand-sub">Group Summaries</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncLabel">Connecting&hellip;</span></span>
    <div class="tabs">
      <button class="btn ghost" id="navList">Current Groups</button>
      <button class="btn ghost" id="navPast">Past Groups</button>
      <button class="btn ghost" id="navTasks">Tasks</button>
      <button class="btn ghost" id="navCustomers">Past Customers</button>
      <button class="btn primary" id="navNew">+ New Summary</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
/* ================================================================
   Room Layout Planner — drag-and-drop event setup diagrams for
   Sunrise Hall, Moose Hollow and Azure Cove. Used by Event Space
   session cards. Stored compactly on each session as
   session.layout = { room, it:"code,x,y,rot[,group];...", w? }
   ================================================================ */
window.LayoutPlanner = (function(){
  "use strict";

  /* Rooms: sizes estimated from the Sunrise Resort floor plan (ft). */
  const ROOMS = {
    'Sunrise Hall': {
      w:60, h:61.5,
      poly:[[19.5,0],[60,0],[60,61.5],[17.8,61.5],[0,43.2],[0,18.5]],
      doors:[[[60,9.5],[60,12.5]],[[60,24.5],[60,27.5]]],
      windows:[[[21,61.5],[58,61.5]],[[0,21],[0,41]],[[2,45.2],[15.8,59.5]],[[2.2,16.4],[17.4,2]]],
      labels:[{t:'Catering',x:61.6,y:11,r:90},{t:'Restrooms / lobby',x:61.6,y:42,r:90},{t:'Windows',x:39,y:63.4,r:0}]
    },
    'Moose Hollow': {
      w:36.3, h:66,
      poly:[[19.8,0],[36.3,0],[36.3,66],[22.3,66],[0,47.9],[0,19]],
      doors:[[[36.3,25.5],[36.3,28.5]]],
      windows:[[[0,22],[0,45]],[[2,49.5],[20.3,64.4]],[[2,17.3],[17.8,1.7]]],
      labels:[{t:'Hallway',x:37.9,y:27,r:90}]
    },
    'Azure Cove': {
      w:32, h:34.3,
      poly:[[0,0],[32,0],[32,34.3],[0,34.3]],
      doors:[[[26,0],[29,0]],[[2.5,34.3],[5.5,34.3]]],
      windows:[],
      labels:[{t:'Hallway',x:16,y:-1.2,r:0},{t:'Exterior',x:16,y:36,r:0}]
    }
  };
  const ROOM_NAMES = Object.keys(ROOMS);
  const PAD = 5;

  /* Furniture, real-world sizes in ft. form* fields map to the session card's checkboxes. */
  const TYPES = {
    lifetime8:{code:'L',label:'Lifetime 8 ft',w:8,h:2.5,shape:'rect',kind:'table',fill:'#cfd4da',formTable:'Lifetime 8 Ft'},
    banquet8:{code:'B',label:'Banquet 8 ft',w:8,h:2.5,shape:'rect',kind:'table',fill:'#c99b68',formTable:'Banquet 8 Ft'},
    round60:{code:'R',label:'Round 60″',w:5,h:5,shape:'circle',kind:'table',fill:'#ece0cb',formTable:'Rounds'},
    chairBlue:{code:'U',label:'Blue chair',w:1.5,h:1.5,shape:'chair',kind:'chair',fill:'#3d6fd6',back:'#1f3f8a',formChair:'Blue'},
    chairWhite:{code:'W',label:'White chair',w:1.5,h:1.5,shape:'chair',kind:'chair',fill:'#fbfbf8',back:'#c8c8be',formChair:'White'},
    highboy:{code:'H',label:'Highboy',w:2.5,h:2.5,shape:'circle',kind:'highboy',fill:'#8b6b4a'},
    podium:{code:'P',label:'Podium',w:2,h:1.6,shape:'rect',kind:'av',fill:'#3b4250',text:'POD',formAv:'Podium'},
    tv:{code:'T',label:'TV on stand',w:5,h:1.4,shape:'rect',kind:'av',fill:'#3b4250',text:'TV',formAv:'TV'},
    screen:{code:'S',label:'Projector screen',w:8,h:0.8,shape:'rect',kind:'av',fill:'#3b4250',text:'SCREEN',formAv:'Projector'},
    sonos:{code:'K',label:'Sonos speaker',w:1.2,h:1.2,shape:'rect',kind:'av',fill:'#3b4250',text:'SP',formAv:'Sonos'},
    stage:{code:'G',label:'Stage riser 8×8',w:8,h:8,shape:'rect',kind:'stage',fill:'#7a6a8f',text:'STAGE'},
    buffet:{code:'F',label:'Buffet / bar 8 ft',w:8,h:2.5,shape:'rect',kind:'service',fill:'#2f7d6d',text:'BUFFET'}
  };
  const CODE2TYPE = {}; Object.keys(TYPES).forEach(function(k){ CODE2TYPE[TYPES[k].code] = k; });
  const PALETTE = ['lifetime8','banquet8','round60','roundSet','tableSet','chairBlue','chairWhite','highboy','podium','tv','screen','sonos','stage','buffet'];
  const SETS = {roundSet:'Round + 8 chairs', tableSet:'8 ft + 3 chairs'};

  let seq = 0, svgSeq = 0;
  const nid = function(){ return 'i' + (++seq).toString(36); };
  const snap = function(v){ return Math.round(v*2)/2; };
  const r1 = function(v){ return Math.round(v*10)/10; };
  const r2 = function(v){ return Math.round(v*100)/100; };
  const normDeg = function(d){ return ((Math.round(d)%360)+360)%360; };
  function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---------- storage format ---------- */
  function decode(layout){
    if(!layout || !layout.room || !ROOMS[layout.room]) return null;
    const items = [];
    String(layout.it || '').split(';').forEach(function(tok){
      if(!tok) return;
      const p = tok.split(',');
      const type = CODE2TYPE[p[0]];
      if(!type) return;
      const it = {id:nid(), type:type, x:+p[1]||0, y:+p[2]||0, rot:+p[3]||0};
      if(p[4]) it.g = 'g' + p[4];
      items.push(it);
    });
    return {room:layout.room, width:(+layout.w || null), items:items};
  }
  function encode(room, width, items){
    const gmap = {}; let gn = 0;
    const it = items.map(function(i){
      let s = TYPES[i.type].code + ',' + r1(i.x) + ',' + r1(i.y) + ',' + (i.rot||0);
      if(i.g){ if(!(i.g in gmap)) gmap[i.g] = (gn++).toString(36); s += ',' + gmap[i.g]; }
      return s;
    }).join(';');
    const out = {room:room, it:it};
    if(width && Math.abs(width - ROOMS[room].w) > 0.05) out.w = r1(width);
    return out;
  }

  /* ---------- geometry ---------- */
  function geom(room, width){
    const b = ROOMS[room]; const k = (width || b.w) / b.w;
    const sp = function(p){ return [r2(p[0]*k), r2(p[1]*k)]; };
    return {name:room, w:b.w*k, h:b.h*k, poly:b.poly.map(sp),
      doors:b.doors.map(function(s){ return s.map(sp); }), windows:b.windows.map(function(s){ return s.map(sp); }),
      labels:b.labels.map(function(l){ return {t:l.t, r:l.r, x:l.x*k, y:l.y*k}; })};
  }
  function pip(p, poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; if(((yi>p[1])!==(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi)) c=!c; } return c; }
  function segDist(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1]; const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy))); return Math.hypot(a[0]+t*dx-p[0], a[1]+t*dy-p[1]); }
  function edgeDist(p,poly){ let m=Infinity; for(let i=0;i<poly.length;i++) m=Math.min(m, segDist(p, poly[i], poly[(i+1)%poly.length])); return m; }
  function corners(it){ const t=TYPES[it.type], a=it.rot*Math.PI/180, c=Math.cos(a), s=Math.sin(a), hw=t.w/2, hh=t.h/2;
    return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(function(q){ return [it.x+q[0]*c-q[1]*s, it.y+q[0]*s+q[1]*c]; }); }
  function fits(it, poly){ const t=TYPES[it.type]; const m = t.kind==='chair' ? 0.3 : 1;
    if(t.shape==='circle') return pip([it.x,it.y],poly) && edgeDist([it.x,it.y],poly) >= t.w/2+m;
    return corners(it).every(function(p){ return pip(p,poly) && edgeDist(p,poly) >= m; }); }
  function area(p){ let a=0; for(let i=0;i<p.length;i++){ const q=p[(i+1)%p.length]; a += p[i][0]*q[1]-q[0]*p[i][1]; } return Math.abs(a/2); }

  /* ---------- quick layouts, built in a "front of room" frame ---------- */
  function frame(R, front){ const w=R.w, h=R.h; switch(front){
    case 'bottom': return {U:w,V:h,map:function(u,v){return [w-u,h-v];},rot:180};
    case 'left':   return {U:h,V:w,map:function(u,v){return [v,h-u];},rot:-90};
    case 'right':  return {U:h,V:w,map:function(u,v){return [w-v,u];},rot:90};
    default:       return {U:w,V:h,map:function(u,v){return [u,v];},rot:0}; } }
  function centersOut(c,pitch,U){ const out=[c]; for(let k=1;k*pitch<U;k++){ out.push(c-k*pitch, c+k*pitch); } return out; }
  function chairLine(u,v,n,len,ch,axis,off,rot){ const out=[]; for(let k=0;k<n;k++){ const d=-len/2+len*(k+.5)/n;
    out.push(axis==='u' ? {type:ch,u:u+d,v:v+off,rot:rot} : {type:ch,u:u+off,v:v+d,rot:rot}); } return out; }

  function generate(R, kind, N, front, tt, ch){
    const F=frame(R,front), U=F.U, V=F.V, cu=U/2, L=TYPES[tt].w;
    let groups=[], stop='seats', need=N;
    if(kind==='classroom'){
      for(let r=0;;r++){ const v=7+1.25+r*6; if(v>V) break;
        centersOut(cu,2*L+4,U).forEach(function(bc){ [-L/2, L/2].forEach(function(du){ const u=bc+du;
          groups.push({p:[r,Math.abs(u-cu)], it:[{type:tt,u:u,v:v,rot:0}].concat(chairLine(u,v,3,L,ch,'u',2.1,0))}); }); }); }
    } else if(kind==='theater'){
      for(let r=0;;r++){ const v=7+r*3; if(v>V) break;
        for(let k=0;;k++){ const du=2.85+k*1.75; if(du>U) break;
          [cu-du, cu+du].forEach(function(u){ groups.push({p:[r,du], it:[{type:ch,u:u,v:v,rot:0}]}); }); } }
    } else if(kind==='rounds'){
      const P=10.5;
      for(let r=0;;r++){ const v=9.5+r*P; if(v>V) break;
        centersOut(cu,P,U).forEach(function(u){ const g=[{type:'round60',u:u,v:v,rot:0}];
          for(let a=0;a<8;a++){ const ang=a*45, rad=ang*Math.PI/180; g.push({type:ch,u:u+3.35*Math.sin(rad),v:v-3.35*Math.cos(rad),rot:ang+180}); }
          groups.push({p:[r,Math.abs(u-cu)], it:g}); }); }
    } else if(kind==='ushape'){
      stop='all';
      const T=Math.max(4,Math.ceil(N/3)), b=Math.max(2,Math.round(T/3)), l=Math.ceil((T-b)/2), half=b*L/2;
      const uL=cu-half+1.25, uR=cu+half-1.25, vB=6+l*L+1.25;
      for(let k=0;k<l;k++){ const v=6+L/2+k*L;
        groups.push({it:[{type:tt,u:uL,v:v,rot:90}].concat(chairLine(uL,v,3,L,ch,'v',-2.1,90))});
        groups.push({it:[{type:tt,u:uR,v:v,rot:90}].concat(chairLine(uR,v,3,L,ch,'v',2.1,-90))}); }
      for(let j=0;j<b;j++){ const u=cu-half+L/2+j*L;
        groups.push({it:[{type:tt,u:u,v:vB,rot:0}].concat(chairLine(u,vB,3,L,ch,'u',2.1,0))}); }
    } else if(kind==='boardroom'){
      stop='all';
      const rows=Math.max(1,Math.ceil(N/6)), v0=Math.max(4,(V-rows*L)/2), uA=cu-1.25, uB=cu+1.25;
      for(let k=0;k<rows;k++){ const v=v0+L/2+k*L;
        groups.push({it:[{type:tt,u:uA,v:v,rot:90}].concat(chairLine(uA,v,3,L,ch,'v',-2.1,90))});
        groups.push({it:[{type:tt,u:uB,v:v,rot:90}].concat(chairLine(uB,v,3,L,ch,'v',2.1,-90))}); }
    } else if(kind==='cocktail'){
      stop='count'; need=Math.ceil(N/4);
      for(let r=0;;r++){ const v=5+r*7; if(v>V) break;
        centersOut(cu,7,U).forEach(function(u){ groups.push({p:[r,Math.abs(u-cu)], it:[{type:'highboy',u:u,v:v,rot:0}]}); }); }
    }
    if(groups[0] && groups[0].p) groups.sort(function(a,b){ return a.p[0]-b.p[0] || a.p[1]-b.p[1]; });
    const out=[]; let seats=0, placed=0, dropped=0;
    for(const g of groups){
      const its = g.it.map(function(o){ const xy=F.map(o.u,o.v); return {id:nid(), type:o.type, x:r2(xy[0]), y:r2(xy[1]), rot:normDeg(o.rot+F.rot)}; });
      if(!its.every(function(i){ return fits(i,R.poly); })){ dropped++; continue; }
      if(its.length>1){ const gid='g'+nid(); its.forEach(function(i){ i.g=gid; }); }
      Array.prototype.push.apply(out, its); placed++;
      seats += its.filter(function(i){ return TYPES[i.type].kind==='chair'; }).length;
      if(stop==='seats' && seats>=N) break;
      if(stop==='count' && placed>=need) break;
    }
    const short = stop==='seats' ? seats<N : stop==='count' ? placed<need : dropped>0;
    return {items:out, seats:seats, placed:placed, short:short};
  }

  /* ---------- drawing ---------- */
  function tf(i){ return 'translate('+r2(i.x)+' '+r2(i.y)+') rotate('+i.rot+')'; }
  function itemSVG(i, on){
    const t = TYPES[i.type]; let b = '';
    if(t.shape==='circle') b = '<circle r="'+(t.w/2)+'" fill="'+t.fill+'" stroke="#4a4f5a" stroke-width="0.1"/>' + (i.type==='highboy' ? '<circle r="0.4" fill="#5a4630"/>' : '');
    else if(t.shape==='chair') b = '<rect x="-0.7" y="-0.72" width="1.4" height="1.25" rx="0.3" fill="'+t.fill+'" stroke="#2c3a55" stroke-width="0.08"/><rect x="-0.72" y="0.42" width="1.44" height="0.4" rx="0.15" fill="'+t.back+'" stroke="#2c3a55" stroke-width="0.06"/>';
    else b = '<rect x="'+(-t.w/2)+'" y="'+(-t.h/2)+'" width="'+t.w+'" height="'+t.h+'" rx="0.2" fill="'+t.fill+'" stroke="#4a4f5a" stroke-width="0.1"/>' +
      (t.text ? '<text font-size="'+Math.min(0.9, t.h*0.55)+'" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700" font-family="Arial,Helvetica,sans-serif">'+t.text+'</text>' : '');
    const hl = on ? '<rect x="'+(-t.w/2-0.35)+'" y="'+(-t.h/2-0.35)+'" width="'+(t.w+0.7)+'" height="'+(t.h+0.7)+'" rx="0.4" fill="none" stroke="#e0803a" stroke-width="0.18" stroke-dasharray="0.5 0.3"/>' : '';
    return '<g data-lp-id="'+i.id+'" class="lp-it" transform="'+tf(i)+'">'+b+hl+'</g>';
  }
  function roomSVG(R){
    const n = 'lp' + (++svgSeq);
    const pts = R.poly.map(function(p){ return p.join(','); }).join(' ');
    const seg = function(s,st,w){ return '<line x1="'+s[0][0]+'" y1="'+s[0][1]+'" x2="'+s[1][0]+'" y2="'+s[1][1]+'" stroke="'+st+'" stroke-width="'+w+'"/>'; };
    const doors = R.doors.map(function(s){ return seg(s,'#ffffff',0.6) + seg(s,'#e0803a',0.3); }).join('');
    const wins = R.windows.map(function(s){ return seg(s,'#9cc3e6',0.22); }).join('');
    const labels = R.labels.map(function(l){ return '<text x="'+l.x+'" y="'+l.y+'" transform="rotate('+l.r+' '+l.x+' '+l.y+')" font-size="1.1" fill="#8a93a3" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif">'+l.t+'</text>'; }).join('');
    const sb = '<g transform="translate(0 '+(R.h+2.6)+')"><line x1="0" y1="0" x2="10" y2="0" stroke="#5b6472" stroke-width="0.15"/><line x1="0" y1="-0.4" x2="0" y2="0.4" stroke="#5b6472" stroke-width="0.15"/><line x1="10" y1="-0.4" x2="10" y2="0.4" stroke="#5b6472" stroke-width="0.15"/><text x="11" y="0" font-size="1" fill="#5b6472" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif">10 ft</text></g>';
    return '<defs><pattern id="'+n+'a" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#e8ebef" stroke-width="0.04"/></pattern>' +
      '<pattern id="'+n+'b" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#'+n+'a)"/><path d="M5 0H0V5" fill="none" stroke="#d3d9e1" stroke-width="0.07"/></pattern>' +
      '<clipPath id="'+n+'c"><polygon points="'+pts+'"/></clipPath></defs>' +
      '<rect x="'+(-PAD)+'" y="'+(-PAD)+'" width="'+r2(R.w+2*PAD)+'" height="'+r2(R.h+2*PAD)+'" fill="#ffffff"/>' +
      '<polygon points="'+pts+'" fill="#fbfaf7"/><rect x="0" y="0" width="'+R.w+'" height="'+R.h+'" fill="url(#'+n+'b)" clip-path="url(#'+n+'c)"/>' +
      '<polygon points="'+pts+'" fill="none" stroke="#2a2f3a" stroke-width="0.45" stroke-linejoin="round"/>' + wins + doors + labels + sb;
  }
  function viewBox(R){ return (-PAD)+' '+(-PAD)+' '+r2(R.w+2*PAD)+' '+r2(R.h+2*PAD); }

  function tally(items){
    const c = {}; items.forEach(function(i){ c[i.type] = (c[i.type]||0) + 1; });
    return {c:c, tables:(c.lifetime8||0)+(c.banquet8||0)+(c.round60||0), chairs:(c.chairBlue||0)+(c.chairWhite||0), highboys:c.highboy||0};
  }
  function countsText(items){
    const c = tally(items).c;
    return Object.keys(TYPES).filter(function(k){ return c[k]; }).map(function(k){ return c[k] + ' ' + TYPES[k].label; }).join(' · ');
  }

  /* ---------- public helpers used by the summary form ---------- */
  function summarize(layout){
    const d = decode(layout); if(!d) return null;
    const t = tally(d.items), set = function(key){ const out=[]; d.items.forEach(function(i){ const v=TYPES[i.type][key]; if(v && out.indexOf(v)<0) out.push(v); }); return out; };
    return {room:d.room, tables:t.tables, chairs:t.chairs, highboys:t.highboys, itemCount:d.items.length,
      tableTypes:set('formTable'), chairTypes:set('formChair'), avNeeds:set('formAv'), text:countsText(d.items)};
  }
  function standaloneSVG(d, extra){
    const R = geom(d.room, d.width);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+viewBox(R)+'"'+(extra||'')+'>'+roomSVG(R)+d.items.map(function(i){ return itemSVG(i,false); }).join('')+'</svg>';
  }
  function thumbHTML(layout){
    const d = decode(layout); if(!d) return '';
    return '<div class="lp-thumb">'+standaloneSVG(d, ' preserveAspectRatio="xMidYMid meet"')+'</div>';
  }
  function toPNG(layout, pxPerFt){
    const d = decode(layout); if(!d) return Promise.resolve(null);
    const R = geom(d.room, d.width), S = pxPerFt || 12;
    const W = Math.round((R.w+2*PAD)*S), H = Math.round((R.h+2*PAD)*S);
    const markup = standaloneSVG(d, ' width="'+W+'" height="'+H+'"');
    return new Promise(function(resolve){
      const img = new Image();
      img.onload = function(){
        try{ const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(img,0,0);
          resolve({dataUrl:c.toDataURL('image/png'), w:W, h:H}); }catch(e){ resolve(null); } };
      img.onerror = function(){ resolve(null); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
    });
  }

              '<button type="button" class="lp-btn primary" style="width:100%;margin-top:10px" data-r="apply">Apply layout</button>' +
              '<div class="lp-status" data-r="status"></div></div>' +
            '<div class="lp-card"><h4>Add pieces</h4><div class="lp-pal" data-r="palette"></div></div>' +
            '<div class="lp-card"><h4>Selected</h4><div class="lp-sel">' +
              '<button type="button" class="lp-btn" data-act="rotL">⟲ 15°</button><button type="button" class="lp-btn" data-act="rotR">⟳ 15°</button>' +
              '<button type="button" class="lp-btn" data-act="rot90">⟳ 90°</button><button type="button" class="lp-btn" data-act="dup">Duplicate</button>' +
              '<button type="button" class="lp-btn" data-act="ungroup">Ungroup</button><button type="button" class="lp-btn" data-act="del">Delete</button></div>' +
              '<div class="lp-hint">Click to select — a round selects with its chairs. Shift+click adds to the selection. R rotates, arrow keys nudge, Delete removes, Ctrl/⌘+Z undoes.</div></div>' +
            '<div class="lp-card"><h4>Room size</h4><label>Width of this room (ft)</label><input type="number" min="10" step="1" data-r="roomW"><div class="lp-hint" data-r="roomNote"></div></div>' +
          '</div>' +
          '<div class="lp-card">' +
            '<div class="lp-maintop"><b data-r="roomTitle"></b><div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<button type="button" class="lp-btn" data-r="undo">Undo</button><button type="button" class="lp-btn" data-r="clear">Clear room</button><button type="button" class="lp-btn" data-r="png">Download image</button></div></div>' +
            '<div class="lp-canvas"><svg xmlns="http://www.w3.org/2000/svg" data-r="svg"></svg></div>' +
            '<div class="lp-counts" data-r="counts"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    const prevOverflow = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const $ = function(r){ return ov.querySelector('[data-r="'+r+'"]'); };
    const svg = $('svg');
    if(opts.chairType === 'White') $('chairType').value = 'chairWhite';
    if(opts.tableType === 'Banquet 8 Ft') $('tableType').value = 'banquet8';

    const items = function(){ return (S.layouts[S.room] = S.layouts[S.room] || []); };
    const byId = function(id){ return items().find(function(i){ return i.id === id; }); };
    const R = function(){ return geom(S.room, S.widths[S.room]); };
    const selItems = function(){ return items().filter(function(i){ return sel.has(i.id); }); };
    function pushUndo(){ dirty = true; undoStack.push(JSON.stringify({room:S.room, items:items()})); if(undoStack.length > 60) undoStack.shift(); }
    function undo(){ const s = undoStack.pop(); if(!s) return; const o = JSON.parse(s); S.room = o.room; S.layouts[o.room] = o.items; sel.clear(); renderAll(); }

    function renderPlan(){ const g = R(); svg.setAttribute('viewBox', viewBox(g));
      svg.innerHTML = roomSVG(g) + '<g data-r="items">' + items().map(function(i){ return itemSVG(i, sel.has(i.id)); }).join('') + '</g>'; }
    function renderItems(){ const g = svg.querySelector('[data-r="items"]'); if(g) g.innerHTML = items().map(function(i){ return itemSVG(i, sel.has(i.id)); }).join(''); }
    function renderCounts(){
      const t = tally(items());
      const pills = Object.keys(TYPES).filter(function(k){ return t.c[k]; }).map(function(k){ return '<span class="lp-pill"><b>'+t.c[k]+'</b> '+TYPES[k].label+'</span>'; }).join('');
      $('counts').innerHTML = pills ? '<span class="lp-pill"><b>'+t.tables+'</b> tables · <b>'+t.chairs+'</b> chairs total</span>' + pills
        : '<span class="lp-pill">Empty room — apply a quick layout or add pieces</span>';
    }
    function renderSelBar(){ ov.querySelectorAll('[data-act]').forEach(function(b){ b.disabled = !sel.size || (b.dataset.act === 'ungroup' && !selItems().some(function(i){ return i.g; })); }); }
    function renderSide(){
      $('tabs').innerHTML = ROOM_NAMES.map(function(n){ return '<button type="button" class="lp-tab'+(n===S.room?' on':'')+'" data-room="'+n+'">'+n+'</button>'; }).join('');
      const g = R(); $('roomTitle').textContent = g.name; $('roomW').value = Math.round(g.w);
      $('roomNote').textContent = (S.widths[S.room] ? 'Set to ' : 'Estimated from the floor plan: ') + Math.round(g.w) + ' × ' + Math.round(g.h) + ' ft (about ' + Math.round(area(g.poly)).toLocaleString() + ' sq ft). If you know the real width, enter it and the room rescales.';
    }
    function renderAll(){ renderSide(); renderPlan(); renderCounts(); renderSelBar(); }

    function svgPt(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
    function groupIds(it){ return it.g ? items().filter(function(i){ return i.g === it.g; }).map(function(i){ return i.id; }) : [it.id]; }
    svg.addEventListener('pointerdown', function(e){
      const el = e.target.closest('[data-lp-id]');
      if(!el){ if(!e.shiftKey && sel.size){ sel.clear(); renderItems(); renderSelBar(); } return; }
      const it = byId(el.dataset.lpId); if(!it) return;
      const ids = groupIds(it);
      if(e.shiftKey){ const has = sel.has(it.id); ids.forEach(function(id){ has ? sel.delete(id) : sel.add(id); }); }
      else if(!sel.has(it.id)) sel = new Set(ids);
      renderItems(); renderSelBar();
      drag = {p0:svgPt(e), orig:selItems().map(function(i){ return [i, i.x, i.y]; }), moved:false};
      svg.setPointerCapture(e.pointerId); e.preventDefault();
    });
    svg.addEventListener('pointermove', function(e){
      if(!drag) return; const p = svgPt(e); const dx = snap(p.x-drag.p0.x), dy = snap(p.y-drag.p0.y);
      if(!drag.moved){ if(!dx && !dy) return; pushUndo(); drag.moved = true; }
      drag.orig.forEach(function(o){ const i=o[0]; i.x=r2(o[1]+dx); i.y=r2(o[2]+dy); const n = svg.querySelector('[data-lp-id="'+i.id+'"]'); if(n) n.setAttribute('transform', tf(i)); });
    });
    const endDrag = function(){ if(drag && drag.moved) renderCounts(); drag = null; };
    svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);

    function rotateSel(deg){
      const its = selItems(); if(!its.length) return; pushUndo();
      const cx = its.reduce(function(s,i){ return s+i.x; },0)/its.length, cy = its.reduce(function(s,i){ return s+i.y; },0)/its.length;
      const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
      its.forEach(function(i){ const dx=i.x-cx, dy=i.y-cy; i.x=r2(cx+dx*c-dy*s); i.y=r2(cy+dx*s+dy*c); i.rot=normDeg(i.rot+deg); });
      renderItems();
    }
    function nudge(dx,dy){ if(!sel.size) return; pushUndo(); selItems().forEach(function(i){ i.x=r2(i.x+dx); i.y=r2(i.y+dy); }); renderItems(); }
    function delSel(){ if(!sel.size) return; pushUndo(); S.layouts[S.room] = items().filter(function(i){ return !sel.has(i.id); }); sel.clear(); renderItems(); renderCounts(); renderSelBar(); }
    function dupSel(){
      const its = selItems(); if(!its.length) return; pushUndo(); const gmap = {};
      const copies = its.map(function(i){ const n = Object.assign({}, i, {id:nid(), x:r2(i.x+2), y:r2(i.y+2)}); if(i.g){ n.g = gmap[i.g] || (gmap[i.g] = 'g'+nid()); } return n; });
      Array.prototype.push.apply(items(), copies); sel = new Set(copies.map(function(c){ return c.id; })); renderItems(); renderCounts(); renderSelBar();
    }
    function ungroupSel(){ pushUndo(); selItems().forEach(function(i){ delete i.g; }); renderSelBar(); }
    function addPiece(type){
      pushUndo(); const g = R(); const off = (addCount++ % 6) * 1.5; const cx = snap(g.w/2+off), cy = snap(g.h/2+off); const ch = $('chairType').value;
      const n = [];
      if(type === 'roundSet'){ const gid='g'+nid(); n.push({id:nid(),type:'round60',x:cx,y:cy,rot:0,g:gid});
        for(let a=0;a<8;a++){ const r=a*45*Math.PI/180; n.push({id:nid(),type:ch,x:r2(cx+3.35*Math.sin(r)),y:r2(cy-3.35*Math.cos(r)),rot:normDeg(a*45+180),g:gid}); } }
      else if(type === 'tableSet'){ const gid='g'+nid(), tt=$('tableType').value; n.push({id:nid(),type:tt,x:cx,y:cy,rot:0,g:gid});
        [-2.67,0,2.67].forEach(function(d){ n.push({id:nid(),type:ch,x:r2(cx+d),y:r2(cy+2.1),rot:0,g:gid}); }); }
      else n.push({id:nid(),type:type,x:cx,y:cy,rot:0});
      Array.prototype.push.apply(items(), n); sel = new Set(n.map(function(i){ return i.id; })); renderItems(); renderCounts(); renderSelBar();
    }
    function downloadImage(){
      const enc = encode(S.room, S.widths[S.room], items());
      toPNG(enc, 20).then(function(r){ if(!r) return; const a = document.createElement('a'); a.download = S.room.replace(/\s+/g,'-') + '-layout.png'; a.href = r.dataUrl; document.body.appendChild(a); a.click(); a.remove(); });
    }

    $('palette').innerHTML = PALETTE.map(function(k){
      const t = TYPES[k]; const label = t ? t.label : SETS[k];
      const sw = t ? '<span class="lp-sw'+(t.shape==='circle'?' c':'')+'" style="background:'+t.fill+'"></span>' : '<span class="lp-sw c" style="background:#ece0cb;box-shadow:inset 0 0 0 3px #3d6fd6"></span>';
      return '<button type="button" class="lp-btn" data-add-piece="'+k+'">'+sw+label+'</button>'; }).join('');

    function close(){ document.removeEventListener('keydown', onKey, true); document.body.style.overflow = prevOverflow; ov.remove(); }
    function onKey(e){
      if(e.target.matches && e.target.matches('input,select,textarea')) return;
      const mod = e.ctrlKey || e.metaKey;
      if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.stopPropagation(); undo(); return; }
      if(mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); e.stopPropagation(); dupSel(); return; }
      if(e.key === 'Escape'){ e.stopPropagation(); if(sel.size){ sel.clear(); renderItems(); renderSelBar(); } return; }
      if(!sel.size) return;
      const st = e.shiftKey ? 2 : 0.5;
      const k = {Delete:delSel, Backspace:delSel, ArrowLeft:function(){nudge(-st,0);}, ArrowRight:function(){nudge(st,0);}, ArrowUp:function(){nudge(0,-st);}, ArrowDown:function(){nudge(0,st);}}[e.key];
      if(k){ e.preventDefault(); e.stopPropagation(); k(); return; }
      if(e.key === 'r' || e.key === 'R'){ e.preventDefault(); e.stopPropagation(); rotateSel(e.shiftKey ? -15 : 15); }
    }
    document.addEventListener('keydown', onKey, true);

    ov.addEventListener('click', function(e){
      const t = e.target;
      const tab = t.closest('[data-room]'); if(tab){ S.room = tab.dataset.room; sel.clear(); renderAll(); return; }
      const add = t.closest('[data-add-piece]'); if(add){ addPiece(add.dataset.addPiece); return; }
      const act = t.closest('[data-act]'); if(act && !act.disabled){ ({rotL:function(){rotateSel(-15);}, rotR:function(){rotateSel(15);}, rot90:function(){rotateSel(90);}, dup:dupSel, ungroup:ungroupSel, del:delSel})[act.dataset.act](); return; }
      const r = t.closest('[data-r]'); if(!r) return;
      switch(r.dataset.r){
        case 'apply': {
          const N = Math.max(1, parseInt($('headcount').value) || 1), kind = $('preset').value;
          pushUndo();
          const res = generate(R(), kind, N, $('front').value, $('tableType').value, $('chairType').value);
          S.layouts[S.room] = res.items; sel.clear(); renderPlan(); renderCounts(); renderSelBar();
          const st = $('status');
          if(kind === 'cocktail') st.textContent = 'Placed ' + res.placed + ' highboys for ' + N + ' guests.' + (res.short ? ' Room is full at 7 ft spacing.' : '');
          else if(kind === 'ushape' || kind === 'boardroom') st.textContent = res.short ? 'Placed ' + res.seats + ' seats — part of the ' + (kind==='ushape'?'U':'table') + " didn't fit. Try another front of room or fewer guests." : 'Placed ' + res.seats + ' seats.';
          else st.textContent = res.short ? 'Only ' + res.seats + ' of ' + N + ' seats fit with standard aisles. Try another style or front of room.' : 'Placed ' + res.seats + ' seats for ' + N + ' guests.';
          st.className = 'lp-status' + (res.short ? ' warn' : '');
          return; }
        case 'undo': undo(); return;
        case 'clear': pushUndo(); S.layouts[S.room] = []; sel.clear(); renderAll(); $('status').textContent = 'Room cleared — Undo brings it back.'; $('status').className = 'lp-status'; return;
        case 'png': downloadImage(); return;
        case 'cancel':
          if(dirty && !window.confirm('Discard your layout changes?')) return;
          close(); return;
        case 'done': {
          const its = items();
          const out = its.length ? encode(S.room, S.widths[S.room], its) : null;
          close();
          if(typeof onDone === 'function') onDone(out, out ? summarize(out) : null);
          return; }
      }
    });
    $('roomW').addEventListener('change', function(e){ const v = parseFloat(e.target.value); if(!(v >= 10)) return; dirty = true; S.widths[S.room] = v; renderAll(); });

    renderAll();
  }

  injectStyles();
  return { ROOM_NAMES:ROOM_NAMES, open:open, summarize:summarize, thumbHTML:thumbHTML, toPNG:toPNG, injectStyles:injectStyles };
})();

<script>
(function(){
  "use strict";

  /* ---------------- utilities ---------------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function uid(){ return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function getPath(obj, path){
    return path.split('.').reduce((o,k)=> (o==null? undefined : o[k]), obj);
  }
  function setPath(obj, path, value){
    const keys = path.split('.');
    let cur = obj;
    for(let i=0;i<keys.length-1;i++){
      const k = keys[i], nextK = keys[i+1];
      if(cur[k] == null) cur[k] = /^\d+$/.test(nextK) ? [] : {};
      cur = cur[k];
    }
    cur[keys[keys.length-1]] = value;
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
  function fmtDateShort(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }
  function fmtDateDay(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  }
  function nightsBetween(a,b){
    if(!a||!b) return null;
    const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
    if(isNaN(d1)||isNaN(d2)) return null;
    return Math.round((d2-d1)/86400000);
  }
  function monthYearKey(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return '';
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
  }
  function monthYearLabel(key){
    if(!key) return '';
    const parts = key.split('-');
    const dt = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    if(isNaN(dt.getTime())) return key;
    return dt.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  }

  const CATEGORIES = ["Retreat","Wedding","Reunion"];

  // Which company (or companies) a group belongs to. Shown as checkboxes at the top of every
  // summary and as a filter row on the All Groups list.
  const COMPANIES = ["Beaver Creek Lodge","Sunrise Resort","Epic Recreation"];

  /* ================= EDIT YOUR ROOM LISTS HERE =================
     Each property's rooms, in the order they appear in the Room Assignments
     dropdowns. Each line is ["Room name", "Bed summary"]. The property names on
     the left must match the PROPERTIES list just below exactly.
     A property that isn't listed here (or has an empty list) gets a plain
     text box for the room instead of a dropdown.
     Sources: Sunrise Resort Bed Chart, Sunrise Condos Bed Chart, Beaver Creek
     Lodge building map. Sofa sleepers in the condos are queens. */
  const PROPERTY_ROOMS = {
    "Sunrise Resort": [
      ["Room 101", "1 King"],
      ["Room 102", "4 Twin Bunks · no private bath"],
      ["Room 103", "1 King, 1 Twin Bunk"],
      ["Room 104", "2 Queens"],
      ["Room 105", "2 Queens"],

      ["Room 201", "1 King, Sofa Sleeper"],
      ["Room 202", "1 King, Sofa Sleeper"],
      ["Room 203", "2 Queens"],
      ["Room 204", "2 Queens, 1 Twin"],
      ["Room 301", "1 King, 1 Twin Bunk"],
      ["Room 302", "1 King, 1 Twin Bunk"],
      ["Room 303", "1 King, 1 Twin Bunk"],
      ["Room 304", "1 King, 1 Twin Bunk"],
      ["Lighthouse Suite", "1 King"],
      ["Room 306", "1 King"],
      ["Room 307", "2 Queens, 1 Twin"],
      ["Room 308", "1 King"],
      ["Room 309", "1 King, Sofa Sleeper"]
    ],
    "Beaver Creek Lodge": [
      ["Room 1", "Queen + Bunk · adjoins Rm 2"],

      ["Room 3", "Queen + Bunk"],
      ["Room 4", "Queen + Bunk"],
      ["Room 5", "2 Queens"],
      ["Room 6", "Queen + Bunk · ADA"],
      ["Room 8", "2 Queens"],
      ["Room 9", "2 Queens"],
      ["Room 10", "2 Queens"],
      ["Room 11", "2 Queens"],
      ["Room 12", "2 Queens"]
    ],
    "Condos": [
      ["Condo 106", "1 King, Queen Sofa Sleeper"],
      ["Condo 111", "1 King, Queen Murphy, Queen Sofa Sleeper"],
      ["Condo 120", "1 King, Queen Sofa Sleeper"],
      ["Condo 202", "1 King, Queen Sofa Sleeper"],
      ["Condo 207", "1 King, Queen Sofa Sleeper"],
      ["Condo 220", "1 King, Queen Sofa Sleeper"],
      ["Condo 310", "2 Kings, 2 Queen Sofa Sleepers · 2BR/2BA"]
    ]
  };
  function roomNames(property){ return (PROPERTY_ROOMS[property] || []).map(function(r){ return r[0]; }); }
  function roomBeds(property, room){
    const hit = (PROPERTY_ROOMS[property] || []).find(function(r){ return r[0] === room; });
    return hit ? hit[1] : '';
  }
  /* ============================================================== */
  const PROPERTIES = ["Sunrise Resort","Beaver Creek Lodge","Eagle's Roost","Oso Blue Yurts","Beach House","Condos"];
  const EVENT_SPACES = ["Sunrise Hall","Moose Hollow","Azure Cove","Cisco Board Room","Beaver Creek Lodge Gathering Room"];
  const SESSION_TYPES = ["Partial Day","Full Day"];
  const TABLE_TYPES = ["Lifetime 8 Ft","Banquet 8 Ft","Rounds"];
  const CHAIR_TYPES = ["Blue","White"];
  const AV_OPTIONS = ["Podium","TV","Projector","Sonos","Microphones","Round the Clock Assistance"];
  const STAFF_OPTIONS = ["Bradley","Kristen","Sam","Kylie","Tricia","Mark","Jack","Carter","Morgan","Aly","Jordan"];
  const ORIENTATIONS = ["Banquet","U-Shape","Conference","Stadium","Custom"];
  const MAX_ATTACHMENT_BYTES = 10*1024*1024;

  function buildTimeSlots(){
    const slots = [];
    for(let h=0; h<24; h++){
      for(let m=0; m<60; m+=15){
        const value = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        const period = h < 12 ? 'AM' : 'PM';
        let h12 = h % 12; if(h12 === 0) h12 = 12;
        slots.push({ value:value, label: h12 + ':' + String(m).padStart(2,'0') + ' ' + period });
      }
    }
    return slots;
  }
  const TIME_SLOTS = buildTimeSlots();
  function timeLabelFor(value){
    const slot = TIME_SLOTS.find(function(s){ return s.value === value; });
    return slot ? slot.label : (value || '');
  }
  function timeRangeLabel(start, end){
    const a = timeLabelFor(start), b = timeLabelFor(end);
    if(a && b) return a + ' – ' + b;
    if(b) return 'Until ' + b;
    return a;
  }
  function timeSelectHtml(path, selected){
    const opts = TIME_SLOTS.map(function(s){ return '<option value="'+s.value+'"'+(selected===s.value?' selected':'')+'>'+s.label+'</option>'; }).join('');
    return '<select data-bind="'+path+'"><option value=""></option>'+opts+'</select>';
  }
  function plainSelectHtml(path, options, selected){
    const opts = options.map(function(o){ return '<option value="'+esc(o)+'"'+(selected===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
    return '<select data-bind="'+path+'"><option value=""></option>'+opts+'</select>';
  }
  function checkGroup(label, path, options, selected){
    selected = selected || [];
    return '<div class="field" style="margin-top:10px;"><span>'+esc(label)+'</span><div class="check-row">' +
      options.map(function(o){
        return '<label><input type="checkbox" data-toggle-array="'+path+'" data-value="'+esc(o)+'" '+(selected.indexOf(o)>-1?'checked':'')+'> '+esc(o)+'</label>';
      }).join('') +
    '</div></div>';
  }
  function chipList(arr){
    return (arr && arr.length) ? '<div class="tag-list">'+arr.map(function(a){ return '<span class="tag">'+esc(a)+'</span>'; }).join('')+'</div>' : '<span class="muted-note">—</span>';
  }

  function newEventSpaceSession(){
    return { day:'', dayEnd:'', time:'', timeEnd:'', session:'', orientation:'', orientationNotes:'', spaces:[], tableTypes:[], numTables:'', chairTypes:[], numChairs:'', avNeeds:[], staff:[], staffTeardown:[], notes:'' };
  }

  function formatDateRange(start, end){
    if(!start) return '';
    if(!end || end === start) return fmtDateShort(start);
    return fmtDateShort(start) + ' – ' + fmtDateShort(end);
  }

  function formatBytes(n){
    if(!n) return '0 KB';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }

  function readFileAsDataURL(file){
    return new Promise(function(resolve,reject){
      const r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error || new Error('Could not read file')); };
      r.readAsDataURL(file);
    });
  }

  function collectEmployeeNames(){
    const set = new Set();
    state.groups.forEach(function(g){
      ((g.staffing && g.staffing.internal) || []).forEach(function(s){ if(s.name) set.add(String(s.name).trim()); });
      (g.tasks || []).forEach(function(t){ if(t.assignee) set.add(String(t.assignee).trim()); });
    });
    return Array.from(set).filter(Boolean).sort();
  }

  function emptyGroup(){
    const now = new Date().toISOString();

  /* ---------------- state ---------------- */
  // Paste the Web app URL from your Google Apps Script deployment here (see the setup guide).
  // Until this is filled in, the tool works fine for one person but nothing syncs between browsers.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwF1r0ntuEhPccMCygw_lPz7fVZBQsHfAG6bClle2G6o44rGqcWGJssT1aAhYf3bu2zVw/exec';

  const state = { view:'list', listMode:'current', currentId:null, groups:[], mode:'connecting', search:'', filter:'all', monthFilter:'all', yearFilter:'all', categoryFilter:'all', companyFilter:'all', customerSearch:'' };
  let draft = null;
  let pollTimer = null;
  const tableConfigs = {};
  const LOCAL_KEY = 'eblr-group-summaries-v1';
  const POLL_MS = 15000;

  function apiConfigured(){
    return !!API_URL && API_URL.indexOf('PASTE_YOUR_') !== 0;
  }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ state.groups = JSON.parse(raw); return; }
    }catch(e){}
    const ex = exampleGroup(); ex.id = 'example-demo';
    state.groups = [ex];
    saveLocal();
  }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state.groups)); }catch(e){}
  }

  function setSyncPill(){
    const pill = document.getElementById('syncPill');
    const label = document.getElementById('syncLabel');
    if(state.mode === 'remote'){
      pill.classList.remove('local');
      label.textContent = 'Synced for your team';
    } else if(state.mode === 'local'){
      pill.classList.add('local');
      label.textContent = apiConfigured() ? 'Offline — saved in this browser only' : 'Saved in this browser only';
    } else {
      label.textContent = 'Connecting…';
    }
  }

  // ---- Talking to the Google Apps Script ----
  // Every request gets a time limit, a readable error if Google sends back a web page
  // instead of data, and one automatic retry for brief hiccups.
  const REQUEST_TIMEOUT_MS = 25000;
  let writeSeq = 0;          // bumps every time this browser saves or deletes
  let writesInFlight = 0;    // saves/deletes currently on their way to the sheet
  let pollInFlight = false;  // stops polls from piling on top of each other
  let pollFailures = 0;      // consecutive failed polls

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function apiRequest(method, payload){
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;
    try{
      const opts = { cache:'no-store', redirect:'follow' };
      if(ctrl) opts.signal = ctrl.signal;
      let url = API_URL;
      if(method === 'GET'){
        url += (url.indexOf('?') > -1 ? '&' : '?') + 'action=' + encodeURIComponent(payload.action) + '&_=' + Date.now();
      } else {
        opts.method = 'POST';
        // Sent as plain text on purpose: a JSON content-type makes the browser ask
        // Google for permission first, which Apps Script can't answer.
        opts.headers = { 'Content-Type':'text/plain;charset=utf-8' };
        opts.body = JSON.stringify(payload);
      }
      const resp = await fetch(url, opts);
      const text = await resp.text();
      let data;
      try{ data = JSON.parse(text); }
      catch(e){
        const err = new Error('Google returned a web page instead of data. The Apps Script may need to be redeployed (Deploy → Manage deployments → New version) with access set to "Anyone".');
        err.permanent = true;
        throw err;
      }
      if(!data.ok){
        const err = new Error(data.error || 'The shared sheet reported an error.');
        err.permanent = true;
        throw err;
      }
      return data;
    }catch(e){
      if(e && e.name === 'AbortError') throw new Error('The shared sheet took too long to respond.');
      if(e && e.message === 'Failed to fetch') throw new Error('Could not reach the shared sheet (network problem).');
      throw e;
    }finally{
      if(timer) clearTimeout(timer);
    }
  }

  async function apiWithRetry(method, payload){
    try{
      return await apiRequest(method, payload);
    }catch(e){
      if(e && e.permanent) throw e;
      await sleep(1500);
      return await apiRequest(method, payload);
    }
  }

  async function refreshFromServer(silent){
    if(!apiConfigured()){
      state.mode = 'local';
      setSyncPill();
      return;
    }
    // Don't poll while a save is on its way, and don't stack polls.
    if(pollInFlight || writesInFlight > 0) return;
    pollInFlight = true;
    const seqAtStart = writeSeq;
    try{
      const data = await apiWithRetry('GET', { action:'list' });
      // If this browser saved something while the list was loading, the list is
      // already out of date — throw it away instead of overwriting the new save.
      if(seqAtStart !== writeSeq || writesInFlight > 0) return;
      pollFailures = 0;
      state.groups = data.groups || [];
      state.mode = 'remote';
      saveLocal();
      setSyncPill();
      // Don't yank the list/detail view out from under someone mid-edit.
      if(state.view !== 'edit') render();
    }catch(err){
      pollFailures++;
      console.warn('Group Summaries sync:', err && err.message);
      // One missed poll is usually a Google hiccup — only show Offline after two in a row.
      if(pollFailures >= 2 || state.mode !== 'remote'){
        state.mode = 'local';
        setSyncPill();
      }
      if(!silent) alertInline('Could not reach the shared sheet — showing your last synced copy. (' + err.message + ')', 'error');
    }finally{
      pollInFlight = false;
    }
  }

  async function initStorage(){
    loadLocal();
    render();
    await refreshFromServer(true);
    pollTimer = setInterval(function(){ if(!document.hidden) refreshFromServer(true); }, POLL_MS);
    // Catch up right away when someone comes back to the tab.
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshFromServer(true); });
  }

  async function persistGroup(g){
    if(!g.id) g.id = uid();
    g.updatedAt = new Date().toISOString();
    if(apiConfigured()){
      writeSeq++; writesInFlight++;
      try{
        const data = await apiWithRetry('POST', { action:'save', group:g });
        const saved = data.group || g;
        const idx = state.groups.findIndex(function(x){ return x.id === saved.id; });
        if(idx >= 0) state.groups[idx] = saved; else state.groups.push(saved);
        state.mode = 'remote';
        pollFailures = 0;
        saveLocal();
        setSyncPill();
        return saved.id;
      }finally{
        writeSeq++; writesInFlight--;
      }
    } else {
      const idx = state.groups.findIndex(function(x){ return x.id === g.id; });
      if(idx >= 0) state.groups[idx] = g; else state.groups.push(g);
      saveLocal();
      return g.id;
    }
  }

  async function deleteGroup(id){
    if(apiConfigured()){
      writeSeq++; writesInFlight++;
      try{
        await apiWithRetry('POST', { action:'delete', id:id });
      }catch(e){
        alertInline('Could not delete — ' + e.message);
        return;
      }finally{
        writeSeq++; writesInFlight--;
      }
    }
    state.groups = state.groups.filter(function(g){ return g.id !== id; });
    saveLocal();
    render();
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    setSyncPill();
    const navMap = { navList: state.view==='list' && state.listMode==='current', navPast: state.view==='list' && state.listMode==='past', navTasks: state.view==='tasks', navCustomers: state.view==='customers' };
    Object.keys(navMap).forEach(function(id){ const el = document.getElementById(id); if(el) el.classList.toggle('active', !!navMap[id]); });
    const app = document.getElementById('app');
    if(state.view === 'list') app.innerHTML = renderListView();
    else if(state.view === 'edit'){ renderEditView(app); sizeAutoGrow(app); }
    else if(state.view === 'detail') app.innerHTML = renderDetailView();
    else if(state.view === 'tasks') app.innerHTML = renderTasksView();
    else if(state.view === 'customers') app.innerHTML = renderCustomersView();
  }

  /* ---------------- list view ---------------- */
  /* A group is "past" once its departure date has gone by (or its arrival date,
     if no departure was entered). Groups without dates stay in Current. */
  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function isPastGroup(g){
    const end = g.departureDate || g.arrivalDate;
    return !!end && end < todayKey();
  }
  function groupsInScope(){
    const past = state.listMode === 'past';
    return state.groups.filter(function(g){ return isPastGroup(g) === past; });
  }

  function renderListResults(){
    let groups = groupsInScope();
    if(state.search){
      const q = state.search.toLowerCase();
      groups = groups.filter(function(g){
        return (g.groupName||'').toLowerCase().includes(q) || (g.orgName||'').toLowerCase().includes(q);
      });
    }
    if(state.monthFilter && state.monthFilter !== 'all'){
      groups = groups.filter(function(g){ return (monthYearKey(g.arrivalDate) || 'none') === state.monthFilter; });
    }
    if(state.categoryFilter && state.categoryFilter !== 'all'){
      groups = groups.filter(function(g){ return (g.categories || []).indexOf(state.categoryFilter) > -1; });
    }
    if(state.companyFilter && state.companyFilter !== 'all'){
      groups = groups.filter(function(g){ return (g.companies || []).indexOf(state.companyFilter) > -1; });
    }
    if(state.yearFilter && state.yearFilter !== 'all'){
      groups = groups.filter(function(g){
        const k = monthYearKey(g.arrivalDate);
        return k && k.slice(0,4) === state.yearFilter;
      });
    }
    const newestFirst = state.listMode === 'past';
    groups.sort(function(a,b){
      if(!a.arrivalDate) return 1;
      if(!b.arrivalDate) return -1;
      return newestFirst ? b.arrivalDate.localeCompare(a.arrivalDate) : a.arrivalDate.localeCompare(b.arrivalDate);
    });

    const rows = groups.map(function(g){
      const nights = nightsBetween(g.arrivalDate, g.departureDate);
      const dateStr = g.arrivalDate ? (fmtDateShort(g.arrivalDate) + (g.departureDate ? ' – ' + fmtDateShort(g.departureDate) : '') + (nights ? ' · ' + nights + ' nt' : '')) : 'Dates TBD';
      const myKey = monthYearKey(g.arrivalDate);
      const myLabel = myKey ? monthYearLabel(myKey) : 'No arrival date';
      return '<div class="group-card" data-open="'+esc(g.id)+'">' +
        '<div class="gc-main"><div class="gc-name">'+esc(g.groupName||'Untitled group')+'</div><div class="gc-org">'+esc(g.orgName||'')+'</div></div>' +
        '<div class="gc-dates mono">'+esc(dateStr)+'</div>' +
        '<div class="gc-guests mono">'+(g.totalGuests? esc(g.totalGuests)+' guests':'—')+'</div>' +
        '<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">' +
          (g.companies || []).map(function(c){ return '<span class="pill company">'+esc(c)+'</span>'; }).join('') +
          (g.categories || []).map(function(c){ return '<span class="pill category">'+esc(c)+'</span>'; }).join('') +
          '<span class="pill monthyear">'+esc(myLabel)+'</span>' +
          (g.id === 'example-demo' ? '<span class="pill example">Example</span>' : '') +
        '</div>' +
        '</div>';
    }).join('');

    if(groups.length) return '<div class="group-list">'+rows+'</div>';
    if(state.listMode === 'past') return '<div class="empty-state">No past groups match. Groups land here automatically once their departure date has passed.</div>';
    return '<div class="empty-state">No current or upcoming groups match. <br><br><button class="btn primary" id="emptyNewBtn">+ New Summary</button></div>';
  }

  function buildMonthFilterOptionsHtml(){
    const keys = new Set();
    let hasNone = false;
    groupsInScope().forEach(function(g){
      const k = monthYearKey(g.arrivalDate);
      if(k) keys.add(k); else hasNone = true;
    });
    const sorted = Array.from(keys).sort();
    let html = sorted.map(function(k){
      return '<option value="'+k+'"'+(state.monthFilter===k?' selected':'')+'>'+esc(monthYearLabel(k))+'</option>';
    }).join('');
    if(hasNone){
      html += '<option value="none"'+(state.monthFilter==='none'?' selected':'')+'>No arrival date</option>';
    }
    return html;
  }

  function renderYearTabsHtml(){
    // Years come from the groups on this tab, so past years show up under Past Groups.
    const set = new Set();
    groupsInScope().forEach(function(g){ const k = monthYearKey(g.arrivalDate); if(k) set.add(k.slice(0,4)); });
    const years = Array.from(set).sort();
    if(state.listMode === 'past') years.reverse();
    const tabs = ['all'].concat(years).map(function(y){
      const label = y === 'all' ? 'All Years' : y;
      return '<button type="button" class="year-tab'+(state.yearFilter===y?' active':'')+'" data-year-tab="'+y+'">'+label+'</button>';
    }).join('');
    return '<div class="year-tabs" id="yearTabsRow">'+tabs+'</div>';
  }

  function renderCategoryTabsHtml(){
    const tabs = ['all'].concat(CATEGORIES).map(function(c){
      const label = c === 'all' ? 'All Categories' : c;
      return '<button type="button" class="year-tab'+(state.categoryFilter===c?' active':'')+'" data-category-tab="'+esc(c)+'">'+esc(label)+'</button>';
    }).join('');
    return '<div class="category-tabs" id="categoryTabsRow"><span class="ct-label">Category</span>'+tabs+'</div>';

  function renderCompanyTabsHtml(){
    const tabs = ['all'].concat(COMPANIES).map(function(c){
      const label = c === 'all' ? 'All Companies' : c;
      return '<button type="button" class="year-tab'+(state.companyFilter===c?' active':'')+'" data-company-tab="'+esc(c)+'">'+esc(label)+'</button>';

  function renderListView(){
    return '' +
      (state.listMode === 'past'
        ? '<div class="list-head"><div><h1>Past Groups</h1><p>Groups that have already come and gone — they move here automatically the day after departure.</p></div></div>'
        : '<div class="list-head"><div><h1>Current Groups</h1><p>Groups that are on-site now or coming up — click a group for its full operational summary.</p></div></div>') +
      renderYearTabsHtml() +
      renderCompanyTabsHtml() +
      renderCategoryTabsHtml() +
      '<div class="list-controls">' +
        '<input class="search-input" id="searchInput" type="text" placeholder="Search by group or organization…" value="'+esc(state.search)+'">' +
        '<select class="filter-select" id="monthFilterSelect">' +
          '<option value="all"'+(state.monthFilter==='all'?' selected':'')+'>All arrival months</option>' +
          buildMonthFilterOptionsHtml() +
        '</select>' +
      '</div>' +
      '<div id="resultsContainer">'+renderListResults()+'</div>';
  }

  /* ---------------- edit view ---------------- */
  // Properties offered in a room row: the ones checked under "Properties in use"
  // (or all of them if none are checked yet), plus whatever the row already has.
  function lodgingPropertyOptions(current){
    const inUse = (draft && draft.lodging && draft.lodging.properties) || [];
    const list = (inUse.length ? inUse : PROPERTIES).slice();
    if(current && list.indexOf(current) === -1) list.push(current);
    return list;
  }
  // Rooms offered in row i: that property's rooms, minus any room another row already took.
  function lodgingRoomOptions(i, property, current){
    if(!property) return [];
    const taken = {};
    ((draft && draft.lodging && draft.lodging.assignments) || []).forEach(function(r, j){
      if(j !== i && r.property === property && r.room) taken[r.room] = true;
    });
    const list = roomNames(property).filter(function(rm){ return !taken[rm]; });
    if(current && list.indexOf(current) === -1) list.push(current);
    return list;
  }

  function tableRowHtml(path, i, row, columns){
    const cells = columns.map(function(c){
      const val = esc(row[c.key] || '');
      if(c.type === 'lodgingProperty'){
        const opts = lodgingPropertyOptions(row.property).map(function(o){ return '<option value="'+esc(o)+'"'+(row.property===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
        const legacy = (!row.property && !row.room && row.unit) ? '<div class="legacy-note">Previously typed: '+esc(row.unit)+'</div>' : '';
        return '<td><select data-bind="'+path+'.'+i+'.property" data-lodging-pick="1"><option value="">Choose property</option>'+opts+'</select>'+legacy+'</td>';
      }
      if(c.type === 'lodgingRoom'){
        if(row.property && !roomNames(row.property).length){
          // No room list for this property yet — type the room instead.
          return '<td><textarea class="autogrow oneline" rows="1" data-bind="'+path+'.'+i+'.room" placeholder="Type room / unit">'+esc(row.room||'')+'</textarea></td>';
        }
        const rooms = lodgingRoomOptions(i, row.property, row.room);
        const opts = rooms.map(function(o){
          const beds = roomBeds(row.property, o);
          return '<option value="'+esc(o)+'"'+(row.room===o?' selected':'')+'>'+esc(o + (beds ? ' — ' + beds : ''))+'</option>';
        }).join('');
        const placeholder = !row.property ? 'Pick a property first' : (rooms.length ? 'Choose room' : 'All rooms assigned');
        return '<td><select data-bind="'+path+'.'+i+'.room" data-lodging-pick="1"'+(row.property?'':' disabled')+'><option value="">'+placeholder+'</option>'+opts+'</select></td>';
      }
      if(c.type === 'select'){
        const opts = c.options.map(function(o){ return '<option value="'+esc(o)+'"'+(row[c.key]===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
        return '<td><select data-bind="'+path+'.'+i+'.'+c.key+'"><option value=""></option>'+opts+'</select></td>';
      }
      if(c.type === 'checkbox'){
        return '<td style="text-align:center;"><input type="checkbox" data-bind="'+path+'.'+i+'.'+c.key+'" '+(row[c.key]?'checked':'')+'></td>';
      }
      if(c.type === 'autogrow'){
        return '<td><textarea class="autogrow" rows="1" data-bind="'+path+'.'+i+'.'+c.key+'" placeholder="'+esc(c.placeholder||'')+'">'+val+'</textarea></td>';
      }
      if(c.type === 'datalist'){
        return '<td><input data-bind="'+path+'.'+i+'.'+c.key+'" type="text" list="'+esc(c.listId)+'" placeholder="'+esc(c.placeholder||'')+'" value="'+val+'"></td>';
      }
      if(!c.type || c.type === 'text'){
        return '<td><textarea class="autogrow oneline" rows="1" data-bind="'+path+'.'+i+'.'+c.key+'" placeholder="'+esc(c.placeholder||'')+'">'+val+'</textarea></td>';
      }
      return '<td><input data-bind="'+path+'.'+i+'.'+c.key+'" type="'+(c.type||'text')+'" placeholder="'+esc(c.placeholder||'')+'" value="'+val+'"></td>';
    }).join('');

  function addUnique(arr, vals){ arr = arr || []; (vals||[]).forEach(function(v){ if(arr.indexOf(v) < 0) arr.push(v); }); return arr; }
  function applyLayoutToSession(s, layout, sum){
    if(!layout || !sum){ delete s.layout; return; }
    s.layout = layout;
    s.numTables = sum.tables;
    s.numChairs = sum.chairs;
    s.spaces = addUnique(s.spaces, [sum.room]);
    s.tableTypes = addUnique(s.tableTypes, sum.tableTypes);
    s.chairTypes = addUnique(s.chairTypes, sum.chairTypes);
    s.avNeeds = addUnique(s.avNeeds, sum.avNeeds);
  }
  function openSessionLayout(idx){

    const LP = window.LayoutPlanner;
    const room = (s.spaces||[]).find(function(r){ return LP.ROOM_NAMES.indexOf(r) > -1; });
    LP.open(s.layout, {
      title: 'Room layout — Session ' + (idx+1),
      room: room,
      headcount: draft.totalGuests,
      chairType: (s.chairTypes||[])[0],
      tableType: (s.tableTypes||[]).find(function(t){ return t !== 'Rounds'; })
    }, function(layout, sum){
      applyLayoutToSession(s, layout, sum);

      const id = await persistGroup(draft);
      state.currentId = id;
      state.view = 'detail';
      draft = null;

  function alertInline(msg, kind){
    kind = kind || 'error';
    const app = document.getElementById('app');
    const box = document.createElement('div');
    box.className = 'section-card';
    const color = kind === 'success' ? 'var(--good)' : 'var(--danger)';
    box.style.borderColor = color;
    box.style.color = color;
    box.textContent = msg;
    app.prepend(box);
    if(kind !== 'success'){
      box.style.position = 'sticky'; box.style.top = '10px'; box.style.zIndex = '50';
      box.style.background = 'var(--danger-soft, #fdecea)';
      try{ box.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
    }
    setTimeout(function(){ box.remove(); }, kind === 'success' ? 4500 : 12000);
  }
